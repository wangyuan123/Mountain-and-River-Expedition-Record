server:
  port: 8080

# === SECURITY NOTE ============================================================
# 生产部署必须通过环境变量覆盖以下敏感字段, 不能用默认值:
#   WARGAME_DB_PASSWORD 数据库密码  (默认留空 = dev only)
#   WARGAME_JWT_SECRET  >= 32 字节随机字符串 (HS256 必需)
# 启动时 JwtUtil 会校验密钥强度; DevPassword 在数据库层是另一个故事,
# 这里保留空密码作为本地 dev 启动兜底, 警告已在 JwtUtil 那一层打出来。
# =============================================================================

spring:
  datasource:
    url: ${WARGAME_DB_URL:jdbc:mysql://localhost:3306/wargame?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${WARGAME_DB_USER:root}
    password: ${WARGAME_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # 默认仅供本地 dev 启动; 启动时 [SECURITY] 警告会打印, 生产务必覆盖
  secret: ${WARGAME_JWT_SECRET:dev-only-do-not-use-in-prod-please-override-me-now!!}
  expiration: ${WARGAME_JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

game:
  email:
    enabled: ${WARGAME_EMAIL_ENABLED:true}
    host: ${WARGAME_MAIL_HOST:smtp.qq.com}
    port: ${WARGAME_MAIL_PORT:465}
    ssl: ${WARGAME_MAIL_SSL:true}
    username: ${WARGAME_MAIL_USERNAME:}
    password: ${WARGAME_MAIL_PASSWORD:}
    from: ${WARGAME_MAIL_FROM:}
    data-key: ${WARGAME_EMAIL_DATA_KEY:}
    hmac-key: ${WARGAME_EMAIL_HMAC_KEY:}
    hourly-limit: ${WARGAME_MAIL_HOURLY_LIMIT:200}
    daily-limit: ${WARGAME_MAIL_DAILY_LIMIT:1000}
    queue-limit: ${WARGAME_MAIL_QUEUE_LIMIT:1000}
    support-url: ${WARGAME_SUPPORT_URL:}
    trusted-proxies: ${WARGAME_MAIL_TRUSTED_PROXIES:}
  bot:
    enabled: ${WARGAME_BOT_ENABLED:true}
    poll-interval: ${WARGAME_BOT_POLL_INTERVAL:5000}
    batch-size: ${WARGAME_BOT_BATCH_SIZE:10}
  radar:
    radius-per-level: ${WARGAME_RADAR_RADIUS_PER_LEVEL:1}
    reminder-window-ms: ${WARGAME_RADAR_REMINDER_WINDOW_MS:60000}
    recovery-interval-ms: ${WARGAME_RADAR_RECOVERY_INTERVAL_MS:5000}
    page-size: ${WARGAME_RADAR_PAGE_SIZE:50}
  security:
    allowed-origins: ${WARGAME_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  server:
    id: ${WARGAME_SERVER_ID:jiangsu-1}
    name: ${WARGAME_SERVER_NAME:江苏一区}
  compliance:
    # 暂停防沉迷；产品完善后可显式设为 true，并按实施说明恢复默认值与校验。
    enabled: ${WARGAME_COMPLIANCE_ENABLED:false}
    data-key: ${WARGAME_COMPLIANCE_DATA_KEY:}
    calendar-from: ${WARGAME_PLAY_CALENDAR_FROM:}
    calendar-through: ${WARGAME_PLAY_CALENDAR_THROUGH:}
    calendar-source: ${WARGAME_PLAY_CALENDAR_SOURCE:}
    extra-open-dates: ${WARGAME_PLAY_EXTRA_OPEN_DATES:}
    closed-dates: ${WARGAME_PLAY_CLOSED_DATES:}
    support-url: ${WARGAME_SUPPORT_URL:}
  tick-interval: 5000
  tick-batch-size: 100
  tick-max-batches: 20
  tactical-battle-interval: 1000
  tactical-battle-batch-size: 100
  scheduling:
    enabled: true
  max-offline-hours: 8
  # 注册/登录限流（防止暴力枚举与刷号）
  auth:
    register-per-ip-per-hour: 5
    login-fail-per-account-per-hour: 10
    login-fail-global-per-ip-per-minute: 30
