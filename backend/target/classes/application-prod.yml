server:
  port: 8080

# === SECURITY NOTE ============================================================
# 生产部署必须通过环境变量覆盖以下敏感字段:
#   WARGAME_DB_PASSWORD 数据库密码  (默认留空 = dev only)
#   WARGAME_JWT_SECRET  >= 32 字节随机字符串 (HS256 必需)
# 启动时 JwtUtil 会校验密钥强度.
# 变量名与 application.yml / .env.example 完全一致, 方便统一管理.
# =============================================================================

spring:
  datasource:
    url: ${WARGAME_DB_URL:jdbc:mysql://db:3306/wargame?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${WARGAME_DB_USER:root}
    password: ${WARGAME_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # 默认仅供本地启动; 生产务必通过 WARGAME_JWT_SECRET 覆盖
  secret: ${WARGAME_JWT_SECRET:change-this-in-production-at-least-256-bits-long-for-hs256}
  expiration: ${WARGAME_JWT_EXPIRATION:86400000}

game:
  tick-interval: 5000
  max-offline-hours: 8
