version: '3.8'

# === SECURITY NOTE ============================================================
# 生产部署务必:
#   1. 复制 .env.example 为 .env 并填入真实 WARGAME_DB_PASSWORD / WARGAME_JWT_SECRET
#   2. JWT 密钥用 `openssl rand -base64 48` 生成 (>= 32 字节随机字符串)
#   3. db.healthcheck 暴露的 3306 端口仅用于本地 dev, 生产请删 ports
# =============================================================================

services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wargame}
      MYSQL_ROOT_PASSWORD: ${WARGAME_DB_PASSWORD:-root}
    # ports:
    #   - "3306:3306"   # [安全前置规范] 已由 deploy.sh 自动屏蔽公网暴露
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WARGAME_DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 关键: 显式启用 prod profile, 否则会用 application.yml 的 WARGAME_DB_URL
      # 默认值会指向 localhost, 在容器里连不到 MySQL
      SPRING_PROFILES_ACTIVE: prod
      WARGAME_ALLOWED_ORIGINS: ${WARGAME_ALLOWED_ORIGINS:-}
      WARGAME_TRUSTED_PROXIES: ${WARGAME_TRUSTED_PROXIES:-${WARGAME_MAIL_TRUSTED_PROXIES:-}}
      WARGAME_ADMIN_BOOTSTRAP_USERNAME: ${WARGAME_ADMIN_BOOTSTRAP_USERNAME:-admin}
      WARGAME_ADMIN_BOOTSTRAP_PASSWORD: ${WARGAME_ADMIN_BOOTSTRAP_PASSWORD:-}
      WARGAME_ADMIN_JWT_EXPIRATION: ${WARGAME_ADMIN_JWT_EXPIRATION:-7200000}
      WARGAME_RATE_IP_PER_MINUTE: ${WARGAME_RATE_IP_PER_MINUTE:-1200}
      WARGAME_RATE_IP_WRITES_PER_MINUTE: ${WARGAME_RATE_IP_WRITES_PER_MINUTE:-300}
      WARGAME_RATE_ACCOUNT_PER_MINUTE: ${WARGAME_RATE_ACCOUNT_PER_MINUTE:-600}
      WARGAME_RATE_ACCOUNT_WRITES_PER_MINUTE: ${WARGAME_RATE_ACCOUNT_WRITES_PER_MINUTE:-120}
      WARGAME_RATE_WS_PER_IP_PER_MINUTE: ${WARGAME_RATE_WS_PER_IP_PER_MINUTE:-60}
      WARGAME_RATE_ADMIN_LOGIN_PER_IP_PER_MINUTE: ${WARGAME_RATE_ADMIN_LOGIN_PER_IP_PER_MINUTE:-20}
      WARGAME_RATE_ADMIN_LOGIN_PER_ACCOUNT_PER_QUARTER_HOUR: ${WARGAME_RATE_ADMIN_LOGIN_PER_ACCOUNT_PER_QUARTER_HOUR:-10}
      WARGAME_SERVER_ID: ${WARGAME_SERVER_ID:-jiangsu-1}
      WARGAME_SERVER_NAME: ${WARGAME_SERVER_NAME:-江苏一区}
      WARGAME_EMAIL_ENABLED: ${WARGAME_EMAIL_ENABLED:-true}
      WARGAME_MAIL_HOST: ${WARGAME_MAIL_HOST:-smtp.qq.com}
      WARGAME_MAIL_PORT: ${WARGAME_MAIL_PORT:-465}
      WARGAME_MAIL_SSL: ${WARGAME_MAIL_SSL:-true}
      WARGAME_MAIL_USERNAME: ${WARGAME_MAIL_USERNAME:-}
      WARGAME_MAIL_PASSWORD: ${WARGAME_MAIL_PASSWORD:-}
      WARGAME_MAIL_FROM: ${WARGAME_MAIL_FROM:-}
      WARGAME_EMAIL_DATA_KEY: ${WARGAME_EMAIL_DATA_KEY:-}
      WARGAME_EMAIL_HMAC_KEY: ${WARGAME_EMAIL_HMAC_KEY:-}
      WARGAME_MAIL_HOURLY_LIMIT: ${WARGAME_MAIL_HOURLY_LIMIT:-200}
      WARGAME_MAIL_DAILY_LIMIT: ${WARGAME_MAIL_DAILY_LIMIT:-1000}
      WARGAME_MAIL_QUEUE_LIMIT: ${WARGAME_MAIL_QUEUE_LIMIT:-1000}
      WARGAME_MAIL_TRUSTED_PROXIES: ${WARGAME_MAIL_TRUSTED_PROXIES:-}
      WARGAME_COMPLIANCE_ENABLED: ${WARGAME_COMPLIANCE_ENABLED:-false}
      WARGAME_COMPLIANCE_DATA_KEY: ${WARGAME_COMPLIANCE_DATA_KEY:-}
      WARGAME_PLAY_CALENDAR_FROM: ${WARGAME_PLAY_CALENDAR_FROM:-}
      WARGAME_PLAY_CALENDAR_THROUGH: ${WARGAME_PLAY_CALENDAR_THROUGH:-}
      WARGAME_PLAY_CALENDAR_SOURCE: ${WARGAME_PLAY_CALENDAR_SOURCE:-}
      WARGAME_PLAY_EXTRA_OPEN_DATES: ${WARGAME_PLAY_EXTRA_OPEN_DATES:-}
      WARGAME_PLAY_CLOSED_DATES: ${WARGAME_PLAY_CLOSED_DATES:-}
      WARGAME_SUPPORT_URL: ${WARGAME_SUPPORT_URL:-}
      WARGAME_DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-wargame}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      WARGAME_DB_USER: root
      WARGAME_DB_PASSWORD: ${WARGAME_DB_PASSWORD:-root}
      WARGAME_JWT_SECRET: ${WARGAME_JWT_SECRET:?WARGAME_JWT_SECRET must be set (use `openssl rand -base64 48`)}
    volumes:
      # 后端上传目录与 Nginx 静态资源共享，重建容器后仍保留自定义头像。
      - ./frontend/img/avatars/custom:/app/frontend/img/avatars/custom
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    restart: unless-stopped

volumes:
  mysqldata:
