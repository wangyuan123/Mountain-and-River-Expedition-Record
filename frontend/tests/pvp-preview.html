<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue-white-classic">
<head>
  <meta charset="UTF-8">
  <title>PvP 对战页面紧凑度与空间利用率优化预览</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/classic-home.css">
  <link rel="stylesheet" href="../css/pvp.css">
  <link rel="stylesheet" href="../css/themes.css">
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #dfeaec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .preview-header {
      max-width: 820px;
      margin: 0 auto 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      font-size: 13px;
    }
    .preview-header h1 {
      margin: 0;
      font-size: 15px;
      color: #19458d;
    }
    .toolbar-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn-toggle {
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid #b8cde4;
      border-radius: 4px;
      background: #f0f6fc;
      cursor: pointer;
      color: #19458d;
    }
    .btn-toggle.active {
      background: #2457a5;
      color: #fff;
      border-color: #19458d;
      font-weight: bold;
    }
    .viewport-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .viewport-box {
      background: #fff;
      border: 1px solid #c2d0df;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .viewport-label {
      background: #2b5c92;
      color: #fff;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .phone-frame {
      width: 390px;
      height: 740px;
      overflow-y: auto;
    }
    .tablet-frame {
      width: 620px;
      height: 740px;
      overflow-y: auto;
    }
    .nav-mock {
      background: #2b5c92;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1.7;
      word-break: keep-all;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-mock span {
      margin-right: 6px;
      opacity: 0.85;
    }
    .nav-mock span.active {
      font-weight: bold;
      background: rgba(255, 255, 255, 0.25);
      padding: 1px 5px;
      border-radius: 3px;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="preview-header">
    <div>
      <h1>PvP 紧凑排版与战术雷达动态匹配视界预览</h1>
      <small style="color: #64748b;">360°旋转雷达扫描光锥 · 声呐扩散波 · 信号律动指示条 · 目标锁定动效</small>
    </div>
    <div class="toolbar-group">
      <span>阶段状态：</span>
      <button class="btn-toggle active" id="btn-state-lobby" onclick="setMatchState('lobby')">1. 编队准备</button>
      <button class="btn-toggle" id="btn-state-queued" onclick="setMatchState('queued')">2. 雷达搜索匹配中</button>
      <button class="btn-toggle" id="btn-state-accepting" onclick="setMatchState('accepting')">3. 目标锁定(确认中)</button>
    </div>
    <div class="toolbar-group" style="margin-left:auto;">
      <span>主题：</span>
      <button class="btn-toggle active" id="btn-theme-blue" onclick="setTheme('blue-white-classic')">战术蓝白</button>
      <button class="btn-toggle" id="btn-theme-paper" onclick="setTheme('paper')">公文沙盘</button>
      <button class="btn-toggle" id="btn-theme-dark" onclick="setTheme('dark')">夜航终端</button>
    </div>
  </div>

  <div class="viewport-container">
    <!-- 移动端视口 (390px) -->
    <div class="viewport-box phone-frame">
      <div class="viewport-label">
        <span>手机视口 (390px 紧凑测试)</span>
        <span>完整 4 列不换行/横滚</span>
      </div>
      <div class="nav-mock">
        <span>首页</span> <span>治略</span> <span>军团</span> <span>仓库</span> <span>科技</span> <span>军校</span> <span class="active">对战</span>
      </div>
      <div id="pvp-mobile-mount"></div>
    </div>

    <!-- 宽屏/平板视口 (620px) -->
    <div class="viewport-box tablet-frame">
      <div class="viewport-label">
        <span>桌面/平板视口 (620px)</span>
        <span>顶部表单单行紧凑自适应</span>
      </div>
      <div class="nav-mock">
        <span>首页</span> <span>治略</span> <span>军工</span> <span>军官</span> <span>军队</span> <span>地图</span> <span>军情</span> <span>战报</span> <span>仓库</span> <span>科技</span> <span>军校</span> <span class="active">对战</span>
      </div>
      <div id="pvp-tablet-mount"></div>
    </div>
  </div>

  <script src="../js/constants.js"></script>
  <script>
    // 注入预览所需的全局配置与 Mock API
    const unitsData = {
      infantry: { name: '步兵-加兰德步枪兵（M1）', branch: 'land' },
      truck: { name: '卡车-十轮大卡（CCKW-353）', branch: 'land' },
      armored_car: { name: '装甲车-猎鹿犬防空型（T17E2）', branch: 'land' },
      recon_car: { name: '侦查装甲车-灰狗（M8）', branch: 'land' },
      light_tank: { name: '轻型坦克-斯图亚特（M5A1）', branch: 'land' },
      medium_tank: { name: '中型坦克-谢尔曼（M4A3E8）', branch: 'land' },
      heavy_tank: { name: '重型坦克-潘兴（M26）', branch: 'land' },
      fighter: { name: '战斗机-野马（P-51D）', branch: 'air' },
      bomber: { name: '轰炸机-空中堡垒（B-17）', branch: 'air' }
    };

    const mockLobby = {
      preset: {
        citySlot: 0,
        battlefield: 'LAND_AIR',
        army: {
          infantry: 55371,
          truck: 55649,
          armored_car: 55986,
          recon_car: 55979,
          light_tank: 55980,
          medium_tank: 55980,
          heavy_tank: 55980
        },
        commanderId: 101,
        defaults: {
          infantry: { action: 'ADVANCE' },
          truck: { action: 'HOLD' },
          armored_car: { action: 'ADVANCE' },
          recon_car: { action: 'RETREAT' }
        }
      },
      presetVersion: 1,
      record: { wins: 18, losses: 7, draws: 2 },
      status: { status: 'IDLE', version: 1, region: 'jiangsu-1', serverTime: Date.now() },
      reports: [
        { sessionId: 's1', result: 'WIN', createdAt: Date.now() - 3600000 },
        { sessionId: 's2', result: 'LOSS', createdAt: Date.now() - 86400000 }
      ],
      available: {
        cities: [{ slot: 0, name: '主城' }, { slot: 1, name: '前沿要塞基地' }],
        army: {
          infantry: 989012,
          truck: 993999,
          armored_car: 999999,
          recon_car: 999898,
          light_tank: 999000,
          medium_tank: 850000,
          heavy_tank: 500000,
          fighter: 320000,
          bomber: 280000
        },
        cap: 720000,
        officers: [
          { id: 101, name: '巴顿_军事219', attributes: { military: 344, defense: 80 } },
          { id: 102, name: '麦克阿瑟', attributes: { military: 310, defense: 220 } }
        ],
        chief: '未任命'
      }
    };

    window.Game = window.Game || {};
    window.Game.DATA = { units: unitsData, officerSkills: {} };
    window.Game.escapeHtml = function(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    window.Game.Core = {
      state: { prestige: 15000 },
      route: 'pvp',
      views: {},
      firepowerMul: function() { return 1; }
    };
    window.Game.Battle = {
      renderCommandBonusPanel: function() { return ''; },
      tacticalMarkerRows: function() { return ['infantry']; },
      renderTacticalRangeBeams: function() { return ''; },
      renderTacticalMarkers: function() { return ''; }
    };
    window.Game.WS = { connected: true, on: function() {} };
    window.Game.API = {
      client: {
        serverId: 'jiangsu-1',
        isLoggedIn: function() { return true; },
        getToken: function() { return 'preview-token'; },
        request: function(method, url) {
          if (url.includes('/status')) return Promise.resolve(mockLobby.status);
          if (url.includes('/lobby')) return Promise.resolve(mockLobby);
          return Promise.resolve(mockLobby.status);
        }
      }
    };
  </script>
  <script src="../js/pvp.js"></script>
  <script>
    let currentState = 'lobby';

    async function setMatchState(st) {
      currentState = st;
      document.querySelectorAll('#btn-state-lobby, #btn-state-queued, #btn-state-accepting').forEach(btn => {
        btn.classList.toggle('active', btn.id === 'btn-state-' + st);
      });

      const mobileMount = document.getElementById('pvp-mobile-mount');
      const tabletMount = document.getElementById('pvp-tablet-mount');

      if (st === 'lobby') {
        mockLobby.status = { status: 'IDLE', version: 1, region: 'jiangsu-1', serverTime: Date.now() };
      } else if (st === 'queued') {
        mockLobby.status = {
          status: 'QUEUED',
          version: 2,
          ticketId: 't-12345',
          queuedAt: Date.now() - 42000,
          snapshot: {
            battlefield: 'LAND_AIR',
            commanderName: '巴顿_军事219',
            power: '246,999,424',
            chief: { name: '未任命' },
            army: {
              infantry: 55371,
              truck: 55649,
              armored_car: 55986,
              recon_car: 55979,
              light_tank: 55986,
              medium_tank: 55426,
              heavy_tank: 55426,
              fighter: 55426,
              bomber: 55986
            }
          }
        };
      } else if (st === 'accepting') {
        mockLobby.status = {
          status: 'ACCEPTING',
          version: 3,
          ticketId: 't-12345',
          queuedAt: Date.now() - 68000,
          deadlineAt: Date.now() + 12000,
          accepted: false,
          snapshot: {
            battlefield: 'LAND_AIR',
            commanderName: '巴顿_军事219',
            power: '246,999,424',
            chief: { name: '未任命' },
            army: {
              infantry: 55371,
              truck: 55649,
              armored_car: 55986,
              recon_car: 55979,
              light_tank: 55986,
              medium_tank: 55426,
              heavy_tank: 55426,
              fighter: 55426,
              bomber: 55986
            }
          }
        };
      }

      await window.Game.Pvp.start();
      window.Game.Pvp.render(mobileMount);
      setTimeout(() => {
        if (tabletMount) tabletMount.innerHTML = mobileMount.innerHTML;
      }, 50);
    }

    async function initPreview() {
      await setMatchState('queued');
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelectorAll('#btn-theme-blue, #btn-theme-paper, #btn-theme-dark').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme));
      });
      if (theme === 'dark') {
        document.body.style.background = '#0a1018';
      } else if (theme === 'paper') {
        document.body.style.background = '#e8e2d5';
      } else {
        document.body.style.background = '#dfeaec';
      }
    }

    window.onload = initPreview;
  </script>
</body>
</html>
