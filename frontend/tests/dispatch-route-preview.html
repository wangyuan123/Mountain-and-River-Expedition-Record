<!doctype html>
<html lang="zh-CN" data-theme="blue-white"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出征准备 · 行军路线预览</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/themes.css"><link rel="stylesheet" href="../css/dispatch-route.css">
<style>body{padding:24px 0}#screen{min-height:0}#topbar{padding:18px;font-size:18px}main{padding:14px}.preview-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.preview-note{font-size:11px;color:var(--muted);margin:10px 0}.preview-options button{font-size:12px}.route-label{font-size:12px;color:var(--muted)}</style>
<div id="screen"><div id="topbar">烽原战策 <span style="font-size:12px;opacity:.8"> / 出征部署</span></div><main>
<div class="title">- 出征准备 -</div><div class="panel"><div class="bfield">行动: <b id="actionName">侦查</b> | 目标: <b id="targetName">稀矿厂 Lv.3</b></div>
<div class="route-label">守军未知 · 需先侦察</div><div id="preview" aria-live="polite"></div><div class="desc" id="actionDesc">派遣侦察机前往目标，抵达后进行侦查并生成情报报告，幸存侦察机自动返城。</div></div>
<div class="preview-options"><button class="btn" onclick="show('air')">侦察航线</button><button class="btn" onclick="show('land')">陆路转向</button><button class="btn" onclick="show('sea')">海上航线</button><button class="btn" onclick="show('same')">同坐标</button><button class="btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'blue-white':'dark'">切换明暗</button></div><p class="preview-note">设计预览 · 示例路线数据，海陆背景使用测试地图。</p>
</main></div><script>window.Game={};</script><script src="../js/map-ocean.js"></script><script src="../js/dispatch-route.js"></script><script>
var routes={air:{mode:'air',points:[[126,139],[135,177]],distance:47,seconds:31,cargoLimit:0},land:{mode:'land',points:[[110,130],[110,140],[115,140],[115,158],[135,158],[135,177]],distance:72,seconds:216,cargoLimit:4800},sea:{mode:'sea',points:[[184,104],[190,104],[190,120],[193,120],[193,149],[187,149]],distance:60,seconds:124,cargoLimit:2400},same:{mode:'air',points:[[135,177]],distance:0,seconds:0,cargoLimit:0}};
function show(mode){document.getElementById('actionName').textContent=mode==='land'?'征服':mode==='sea'?'调遣':'侦查';var target=mode==='sea'?'东部港口':'稀矿厂 Lv.3';document.getElementById('targetName').textContent=target;document.getElementById('actionDesc').textContent=mode==='land'?'沿陆地路线前进，抵达目标后发起进攻。':mode==='sea'?'舰队沿可通航海域航行，抵达目标港口后驻扎。':'派遣侦察机前往目标，抵达后进行侦查并生成情报报告，幸存侦察机自动返城。';Game.DispatchRoute.render(document.getElementById('preview'),routes[mode],{start:'我的主城',end:target},Game.MapOcean.ready()?Game.MapOcean:null);}
fetch('ocean-fixture.json').then(r=>r.json()).then(data=>{Game.MapOcean.configure(data);show('air');});
</script></html>
