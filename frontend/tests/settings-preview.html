<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>设置界面紧凑布局预览 · 山河远征录</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/classic-home.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/sound.css">
  <style>
    body {
      background: #0f172a;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
    }
    .preview-box {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .theme-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .theme-btn {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
    }
    .theme-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
  </style>
</head>
<body data-theme="blue-white-classic">
  <div class="preview-box">
    <div class="theme-switcher">
      <button class="theme-btn active" onclick="switchTheme('blue-white-classic', this)">经典蓝白风</button>
      <button class="theme-btn" onclick="switchTheme('paper', this)">公文沙盘风</button>
      <button class="theme-btn" onclick="switchTheme('dark', this)">夜航终端黑</button>
      <button class="theme-btn" onclick="toggleMode(this)">切换游客/登录</button>
    </div>
    <div id="screen">
      <div id="view"></div>
    </div>
  </div>

  <script src="../js/constants.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/sound.js"></script>
  <script>
    window.Game = window.Game || {};
    window.Game.escapeHtml = function (str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    };
    window.Game.go = function (r) { alert('跳转路由: ' + r); };
    window.Game.Main = {
      guestMode: false,
      logout: function (mode) { alert(mode === 'exit' ? '触发退出登录确认' : '触发切换账号确认'); },
      openDisableAccount: function () { alert('打开注销账号模态框'); }
    };
    window.Game.API = {
      isLoggedIn: function () { return !window.Game.Main.guestMode; },
      getUsername: function () { return '深入山林开荒种地'; }
    };
    window.Game.Protection = {
      data: { enabled: true },
      open: function () { alert('打开实名与防沉迷'); }
    };
    window.Game.Core = {
      views: {},
      state: { player: { username: '深入山林开荒种地' } }
    };
  </script>
  <script src="../js/main-view.js"></script>
  <script>
    function render() {
      var v = document.getElementById('view');
      Game.Core.views.settings(v);
    }
    function switchTheme(t, btn) {
      document.body.setAttribute('data-theme', t);
      document.querySelectorAll('.theme-switcher .theme-btn').forEach(b => {
        if (b.innerText.indexOf('风') > -1 || b.innerText.indexOf('黑') > -1) b.classList.remove('active');
      });
      btn.classList.add('active');
      if (Game.Theme) Game.Theme.set(t);
      render();
    }
    function toggleMode(btn) {
      Game.Main.guestMode = !Game.Main.guestMode;
      btn.textContent = Game.Main.guestMode ? '模式: 游客' : '模式: 已登录';
      render();
    }
    render();
  </script>
</body>
</html>
