<!doctype html>
<html lang="zh-CN" data-theme="blue-white-classic">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../"><title>兵种武器微缩模型 · 军队总览</title>
<link rel="stylesheet" href="css/style.css?v=3.4-unit-models">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/classic-home.css?v=1.2-unit-models">
<style>
body{margin:0}.model-tools{display:flex;flex-wrap:wrap;gap:8px;padding:14px;align-items:center}.model-tools strong{margin-right:auto}.model-note{padding:0 14px 10px;color:var(--ink);font-size:12px}#model-view{padding:12px}#model-log{padding:12px}
</style>
</head>
<body><div id="screen">
<div class="model-tools"><strong>兵种武器模型</strong><button class="btn" onclick="showModels(0)">陆军</button><button class="btn" onclick="showModels(1)">空军与舰队</button><button class="btn" onclick="showModels(2)">特种部队</button><button class="btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'blue-white-classic':'dark'">切换主题</button></div>
<div class="model-note">当前兵种对应的装备原型 · 使用首页真实渲染器与示例兵力</div><div id="model-view"></div><div id="model-log"></div>
</div>
<script src="js/constants.js"></script><script src="js/data.js"></script><script src="js/core.js"></script>
<script>
// 预览只使用本地示例兵力，不调用服务器或修改玩家存档。
Game.Core.state={army:{}};
Game.go=function(){document.getElementById('model-log').textContent='已验证军队入口；此页为独立外观预览。';};
</script>
<script src="js/main-view.js?v=3.1-unit-models"></script>
<script>
function showModels(group){
  var groups=[['infantry','motor','truck','armored','ltank','htank','assault','rocket'],['scout','fighter','bomber','transport','destroyer','sub','battleship','carrier'],['special','infantry','motor','truck']];
  Game.Core.state.army={};groups[group].forEach(function(id,i){Game.Core.state.army[id]=12345-i*1234;});
  document.getElementById('model-view').innerHTML='<div class="zone-head"><span class="zone-title">🪖 军队总览</span><span class="zone-sub">带兵上限 20000</span></div><div class="army-summary" onclick="Game.go(\'army\')">'+Game.MainView.renderArmySummaryList()+'</div><div class="army-summary-foot" onclick="Game.go(\'army\')">总兵力 · 示例数据 <span class="army-go">详情 &gt;</span></div>';
}
showModels(0);
</script></body></html>
