<!doctype html><html lang="zh-CN" data-theme="3gqq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>战略地图 · 交互验证</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/themes.css"><link rel="stylesheet" href="css/world-map.css?v=1.5-soil"><style>body{margin:0}#fixture-head{padding:14px;background:#527cac;color:white;font:600 15px sans-serif}.fixture-tools{padding:6px 12px;font:11px sans-serif;background:#edf4fb;color:#426078}.fixture-tools button{margin:4px;padding:4px 8px}#fixture-log{white-space:pre-wrap;font:11px monospace;padding:8px;color:#375975}</style></head><body><div id="screen"><div id="fixture-head">海洋与沿海建城 · 演示数据</div><div class="fixture-tools"><button id="rerender">模拟页面刷新</button><button id="netfail">切换弱网失败</button><button id="pinch">验证双指缩放</button><button id="theme">切换主题</button><div id="fixture-metrics"></div></div><div id="view"></div><div id="fixture-log"></div></div>
<script src="js/constants.js"></script><script src="js/data.js"></script><script src="js/core.js"></script>
<script>
var sampleTargets=[], failed=false, requests=0, log=document.getElementById('fixture-log');
for(var y=0;y<200;y+=3)for(var x=0;x<200;x+=3){var types=['forest','hill','plain','swamp','oil'];var type=Object.keys(Game.DATA.wildTypes)[((x+y)/3)%Object.keys(Game.DATA.wildTypes).length];sampleTargets.push({id:y*200+x+1,kind:'wild',type:type,x:x,y:y,level:1+((x+y)%8),occupied:x===99&&y===99});}
sampleTargets.push({id:1,kind:'player',selfCity:true,x:100,y:100,name:'我的主城',ownerName:'指挥官',ownerId:1});
sampleTargets.push({id:2,kind:'player',selfCity:false,x:103,y:102,name:'北境军团',ownerName:'远征军',ownerId:2,warAt:0,warEndAt:0});
sampleTargets.push({id:3,kind:'npc',x:98,y:102,name:'烈焰营地',level:5,defeated:false});
Game.state=Game.Core.state={player:{activeCityId:1},world:{cityPos:{x:100,y:100},pos:{x:100,y:100},marches:[{fromX:100,fromY:100,targetX:98,targetY:102,startAt:Date.now()-5000,arriveAt:Date.now()+120000}]} };
Game.API={getToken:function(){return 'preview';},getMapChunk:function(cx,cy){requests++;return new Promise(function(resolve,reject){setTimeout(function(){if(failed){reject(Error('演示弱网'));return;}resolve({cx:cx,cy:cy,targets:sampleTargets.filter(function(t){return Math.floor(t.x/16)===cx&&Math.floor(t.y/16)===cy;})});},140);});},getMapTarget:function(kind,id){return Promise.resolve(Object.assign({},sampleTargets.find(function(t){return t.kind===kind&&t.id===id;}),{totalRes:10000,mined:1000}));}};
Game.Core.route='world';Game.Core.renderTop=function(){};Game.Core.footer=function(){return '';};Game.Core.render=function(){var v=document.getElementById('view');if(!Game.WorldMap.mounted(v))v.innerHTML='';if(Game.WorldMap.isMap())Game.WorldMap.render(v);else v.innerHTML='<button onclick="Game.WorldMap.setMode(\'map\')">返回大地图</button>';};
Game.toast=function(t){log.textContent=t;};Game.go=function(r){log.textContent='进入：'+r;};Game.World={mapAction:function(t,action){log.textContent='目标 '+t.kind+':'+t.id+'，操作 '+action;}};
window.addEventListener('error',function(e){log.textContent='ERROR: '+e.message;});
</script><script src="js/map-camera.js"></script><script src="js/map-chunks.js"></script><script src="js/map-layout.js"></script><script src="js/map-ocean.js?v=1.0"></script><script src="js/map-terrain.js?v=3.0-ocean"></script><script src="js/world-map.js"></script><script>
if(new URLSearchParams(location.search).has('showcase')){document.querySelector('.fixture-tools').hidden=true;document.getElementById('fixture-log').hidden=true;}
fetch('tests/ocean-fixture.json').then(function(r){return r.json();}).then(function(data){
  Game.MapOcean.configure(data);
  var sea=function(x,y){return Game.MapOcean.sea(x,y);};
  sampleTargets=sampleTargets.filter(function(t){return t.kind==='wild'&&!sea(t.x,t.y)&&t.x%9===0&&t.y%9===0;});
  sampleTargets.push({id:1,kind:'player',selfCity:true,x:145,y:106,name:'海湾主城',ownerName:'指挥官',ownerId:1,coastal:true});
  sampleTargets.push({id:3,kind:'player',selfCity:false,x:141,y:106,name:'花园卫城',ownerName:'内陆指挥官',ownerId:3,coastal:false});
  sampleTargets.push({id:2,kind:'npc',x:134,y:98,name:'海防要塞',level:5,coastal:true});
  Game.Core.state.world.cityPos={x:145,y:106};Game.Core.state.world.pos={x:145,y:106};Game.Core.state.world.marches=[];
  Game.Core.state.cityOverview={count:1,cap:3,cities:[]};
  Game.API.client={get:function(url){
    if(url.indexOf('/terrain')>=0)return Promise.resolve(data);
    var u=new URL(url,'http://fixture'),x=Number(u.searchParams.get('x')),y=Number(u.searchParams.get('y'));
    var land=x>=0&&y>=0&&x<199&&y<199&&!sea(x,y)&&!sea(x+1,y)&&!sea(x,y+1)&&!sea(x+1,y+1);
    var coastal=sea(x-1,y)||sea(x-1,y+1)||sea(x+2,y)||sea(x+2,y+1)||sea(x,y-1)||sea(x+1,y-1)||sea(x,y+2)||sea(x+1,y+2);
    var occupied=sampleTargets.some(function(t){var n=t.kind==='player'?2:1;return x<t.x+n&&x+2>t.x&&y<t.y+n&&y+2>t.y;});
    var hill=((x*31+y*17)%11<2);
    return Promise.resolve({x:x,y:y,valid:land&&!occupied,coastal:coastal,cityType:coastal?'海岸':hill?'丘陵':'平原',reason:!land?'城市四格占地必须全部位于陆地':occupied?'该范围与现有据点占地重叠':''});
  },post:function(){return Promise.reject(Error('演示页面不扣资源，请在正式游戏中建城'));}};
  Game.Core.render();
});setInterval(function(){var m=Game.WorldMap.metrics();document.getElementById('fixture-metrics').textContent='镜头 '+(m.x||0).toFixed(2)+','+(m.y||0).toFixed(2)+' · 缩放 '+(m.scale||0).toFixed(1)+' · 缓存 '+m.chunks+' · 请求 '+requests+' · 图标 '+m.markers+' · 实际位置 '+Game.state.world.pos.x+','+Game.state.world.pos.y;},300);
document.getElementById('rerender').onclick=function(){Game.Core.render();};document.getElementById('netfail').onclick=function(){failed=!failed;this.textContent=failed?'恢复网络':'切换弱网失败';};document.getElementById('theme').onclick=function(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='3gqq'?'dark':'3gqq';};
document.getElementById('pinch').onclick=function(){var el=document.querySelector('canvas'),r=el.getBoundingClientRect();function e(type,id,x,y){el.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:id,pointerType:'touch',clientX:r.left+x,clientY:r.top+y}));}var old=el.setPointerCapture;el.setPointerCapture=function(){};e('pointerdown',11,140,170);e('pointerdown',12,240,170);e('pointermove',11,100,170);e('pointermove',12,280,170);e('pointerup',11,100,170);e('pointerup',12,280,170);el.setPointerCapture=old;log.textContent='已模拟双指展开手势';};
</script></body></html>
