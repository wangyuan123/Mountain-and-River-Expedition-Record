<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="motorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5b6c4e"/>
      <stop offset="100%" stop-color="#313c28"/>
    </linearGradient>
  </defs>

  <!-- Sidecar Hull (Tub) -->
  <path d="M10 16 C8 16 7 18 7 21 L7 24 L20 24 L21 20 C21 17 18 16 10 16 Z" fill="url(#motorBody)" stroke="#1a2015" stroke-width="0.7"/>

  <!-- Motorcycle Main Frame & Fuel Tank -->
  <polygon points="12,14 17,14 19,19 14,19" fill="#313c28" stroke="#1a2015" stroke-width="0.5"/>
  <rect x="18" y="15" width="4" height="2" rx="0.5" fill="#1e293b"/>

  <!-- Handlebars & Front Fork -->
  <line x1="8" y1="12" x2="6" y2="23" stroke="#334155" stroke-width="1.2"/>
  <rect x="5.5" y="11" width="5" height="1.2" rx="0.4" fill="#0f172a"/>
  <!-- Front Headlight -->
  <circle cx="5" cy="14" r="1.5" fill="#fef08a" stroke="#ca8a04" stroke-width="0.4"/>

  <!-- Wheels (Spoked Tires) -->
  <!-- Front Wheel -->
  <circle cx="6.5" cy="23.5" r="4.2" fill="#1e293b" stroke="#000" stroke-width="0.7"/>
  <circle cx="6.5" cy="23.5" r="2.2" fill="#475569"/>
  <circle cx="6.5" cy="23.5" r="0.8" fill="#94a3b8"/>

  <!-- Rear Wheel -->
  <circle cx="23.5" cy="23.5" r="4.2" fill="#1e293b" stroke="#000" stroke-width="0.7"/>
  <circle cx="23.5" cy="23.5" r="2.2" fill="#475569"/>
  <circle cx="23.5" cy="23.5" r="0.8" fill="#94a3b8"/>
</svg>
