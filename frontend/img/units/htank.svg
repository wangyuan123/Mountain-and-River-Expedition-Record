<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Heavy Tank Armor (Panzer Grey / Camo Dark) -->
    <linearGradient id="htankBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6850"/>
      <stop offset="50%" stop-color="#414c39"/>
      <stop offset="100%" stop-color="#2a3324"/>
    </linearGradient>
    <!-- Track Steel -->
    <linearGradient id="trackSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Long Heavy Gun Barrel (Pointing Left) -->
  <!-- Muzzle Brake -->
  <rect x="0.5" y="11" width="2" height="3" rx="0.5" fill="#1e293b" stroke="#0f172a" stroke-width="0.5"/>
  <!-- Barrel Tube -->
  <rect x="2" y="11.8" width="12" height="1.4" fill="#334155" stroke="#0f172a" stroke-width="0.4"/>
  <!-- Mantlet / Gun Base -->
  <ellipse cx="14" cy="12.5" rx="2.5" ry="3" fill="#2a3324" stroke="#0f172a" stroke-width="0.6"/>

  <!-- Turret (Heavy Armored Silhouette) -->
  <path d="M12 12 C12 8.5 15 8 20 8 C25 8 26 9.5 25.5 15 L13 15 Z" 
        fill="url(#htankBody)" stroke="#1a2315" stroke-width="0.7"/>
  <!-- Commander Cupola Hatch -->
  <rect x="18" y="6.8" width="4.5" height="1.6" rx="0.6" fill="#414c39" stroke="#1a2315" stroke-width="0.5"/>
  <!-- Side Armor Skirt / Stowage Box -->
  <rect x="22" y="10.5" width="4" height="3.5" rx="0.5" fill="#343e2d" stroke="#1a2315" stroke-width="0.4"/>

  <!-- Lower Hull / Chassis -->
  <polygon points="5,15 28,15 30,19 3,19" fill="url(#htankBody)" stroke="#1a2315" stroke-width="0.7"/>
  <!-- Sloped Front Glacis Plate -->
  <polygon points="3,19 5,15 10,15 7,19" fill="#5a6850" opacity="0.6"/>

  <!-- Caterpillar Tracks (Heavy Tread System) -->
  <!-- Outer Track Belt -->
  <path d="M4 20 L27 20 C29 20 30.5 21.5 30.5 24 C30.5 26.5 29 28 27 28 L4 28 C2 28 0.5 26.5 0.5 24 C0.5 21.5 2 20 4 20 Z" 
        fill="url(#trackSteel)" stroke="#000000" stroke-width="0.8"/>
  <!-- Track Inner Recess -->
  <path d="M4.5 21 L26.5 21 C28 21 29 22 29 24 C29 26 28 27 26.5 27 L4.5 27 C3 27 2 26 2 24 C2 22 3 21 4.5 21 Z" 
        fill="#1e293b"/>

  <!-- Road Wheels (Large Overlapping Interleaved Wheels) -->
  <circle cx="5" cy="24" r="2.3" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="5" cy="24" r="0.8" fill="#94a3b8"/>

  <circle cx="9.5" cy="24" r="2.3" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="9.5" cy="24" r="0.8" fill="#94a3b8"/>

  <circle cx="14" cy="24" r="2.3" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="14" cy="24" r="0.8" fill="#94a3b8"/>

  <circle cx="18.5" cy="24" r="2.3" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="18.5" cy="24" r="0.8" fill="#94a3b8"/>

  <circle cx="23" cy="24" r="2.3" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="23" cy="24" r="0.8" fill="#94a3b8"/>

  <!-- Sprocket Wheel -->
  <circle cx="27" cy="24" r="1.8" fill="#334155" stroke="#0f172a" stroke-width="0.6"/>
</svg>
