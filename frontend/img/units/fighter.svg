<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fighterMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Wings (Top-down / oblique fighter planform) -->
  <polygon points="12,15 18,5 23,7 17,16" fill="url(#fighterMetal)" stroke="#1e293b" stroke-width="0.6"/>
  <polygon points="10,16 18,27 23,25 15,17" fill="url(#fighterMetal)" stroke="#1e293b" stroke-width="0.6"/>
  <!-- Wing Roundel -->
  <circle cx="19" cy="22" r="2" fill="#2563eb"/>
  <circle cx="19" cy="22" r="1.2" fill="#fff"/>
  <circle cx="19" cy="22" r="0.6" fill="#dc2626"/>

  <!-- Sleek Fuselage -->
  <path d="M3 15 C3 13.5 8 13.5 20 14 C26 14.2 29 15.2 30 16 C29 16.8 26 17.8 20 18 C8 18.5 3 18.5 3 17 Z" fill="url(#fighterMetal)" stroke="#0f172a" stroke-width="0.7"/>

  <!-- Bubble Canopy -->
  <path d="M11 14 C12 11.5 16 11.5 18 14 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="0.5"/>

  <!-- Red Nose Propeller Spinner -->
  <ellipse cx="2.5" cy="16" rx="1.5" ry="2" fill="#dc2626"/>
  <!-- Propeller Blades Spinning Arc -->
  <ellipse cx="2" cy="16" rx="0.6" ry="6.5" fill="#fef08a" opacity="0.8"/>

  <!-- Tail Fin -->
  <polygon points="26,15 30,8 31,8 29,16" fill="url(#fighterMetal)" stroke="#1e293b" stroke-width="0.5"/>
</svg>
