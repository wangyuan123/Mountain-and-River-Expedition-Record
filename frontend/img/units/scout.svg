<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Plane Fuselage Metal -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Glass Canopy Cyan -->
    <linearGradient id="canopyGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- High-Mounted Straight Wing (Banked angle) -->
  <!-- Far Wing -->
  <polygon points="12,12 18,3 22,4 16,13" fill="#64748b" stroke="#334155" stroke-width="0.5"/>
  <!-- Near Wing (Prominent) -->
  <polygon points="10,14 18,25 22,23 15,13" fill="url(#planeBody)" stroke="#334155" stroke-width="0.6"/>
  <!-- Allied Roundel / Recon Insignia on Wing -->
  <circle cx="18" cy="21" r="2.2" fill="#1e3a8a"/>
  <circle cx="18" cy="21" r="1.4" fill="#f8fafc"/>
  <circle cx="18" cy="21" r="0.7" fill="#dc2626"/>

  <!-- Main Fuselage (Streamlined Torpedo Body pointing Left) -->
  <path d="M4 14.5 C4 13 8 12.5 18 13 C24 13.2 28 14.5 29 15 C29 15.5 24 16.5 18 16.5 C8 16.5 4 16 4 14.5 Z" 
        fill="url(#planeBody)" stroke="#1e293b" stroke-width="0.7"/>

  <!-- Glass Cockpit / Recon Observation Bubble -->
  <path d="M8 13 C9 10.5 13 10.5 15 13 Z" fill="url(#canopyGlass)" stroke="#0284c7" stroke-width="0.5"/>

  <!-- Engine Cowling & Propeller Spinner (Nose, Left) -->
  <path d="M4 13.5 C3 13.5 2 14 2 14.5 C2 15 3 15.5 4 15.5 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="0.5"/>
  <!-- Spinning Propeller Blades (Blur arc) -->
  <ellipse cx="2" cy="14.5" rx="0.8" ry="6" fill="#fef08a" stroke="#ca8a04" stroke-width="0.4" opacity="0.85"/>
  <circle cx="2" cy="14.5" r="0.7" fill="#000"/>

  <!-- Tail Empennage (Vertical Fin & Rudder) -->
  <polygon points="25,14 29,7 31,7 28.5,15" fill="url(#planeBody)" stroke="#334155" stroke-width="0.6"/>
  <!-- Horizontal Stabilizer -->
  <polygon points="26,15 30,17 31,16 27,14" fill="#64748b" stroke="#334155" stroke-width="0.5"/>

  <!-- Landing Gear (Wheels & Struts) -->
  <line x1="11" y1="16" x2="10" y2="20" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="10" cy="20.5" r="1.5" fill="#0f172a"/>
</svg>
