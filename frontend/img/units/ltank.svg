<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Light Tank Camo (Sandy Khaki / Olive Green) -->
    <linearGradient id="ltankBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84966e"/>
      <stop offset="60%" stop-color="#5f714b"/>
      <stop offset="100%" stop-color="#425032"/>
    </linearGradient>
    <linearGradient id="ltankTracks" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Gun Barrel (Agile, High-Velocity 37mm-50mm) -->
  <rect x="2" y="11.5" width="10" height="1.2" fill="#334155" stroke="#0f172a" stroke-width="0.4"/>
  <!-- Mantlet -->
  <ellipse cx="12" cy="12" rx="2" ry="2.2" fill="#425032" stroke="#1f2717" stroke-width="0.5"/>

  <!-- Turret (Compact, Angular) -->
  <path d="M11 11.5 L13 8.5 C14 8 19 8 21 8.5 L22 11.5 L21 14.5 L12 14.5 Z" 
        fill="url(#ltankBody)" stroke="#1f2717" stroke-width="0.6"/>
  <!-- Hatch -->
  <rect x="15" y="7" width="3.5" height="1.4" rx="0.5" fill="#5f714b" stroke="#1f2717" stroke-width="0.4"/>

  <!-- Antenna -->
  <line x1="20" y1="8" x2="23" y2="3.5" stroke="#1f2717" stroke-width="0.6"/>

  <!-- Upper Hull & Sloped Armor -->
  <polygon points="6,14.5 24,14.5 27,18.5 4,18.5" fill="url(#ltankBody)" stroke="#1f2717" stroke-width="0.6"/>
  <polygon points="4,18.5 6,14.5 11,14.5 8,18.5" fill="#a3b78c" opacity="0.4"/>

  <!-- Caterpillar Tracks (Agile light tread) -->
  <path d="M5 19.5 L25 19.5 C27 19.5 28.5 21 28.5 23.5 C28.5 26 27 27.5 25 27.5 L5 27.5 C3 27.5 1.5 26 1.5 23.5 C1.5 21 3 19.5 5 19.5 Z" 
        fill="url(#ltankTracks)" stroke="#000" stroke-width="0.7"/>
  <path d="M5.5 20.5 L24.5 20.5 C26 20.5 27 21.5 27 23.5 C27 25.5 26 26.5 24.5 26.5 L5.5 26.5 C4 26.5 3 25.5 3 23.5 C3 21.5 4 20.5 5.5 20.5 Z" 
        fill="#1e293b"/>

  <!-- 4 Road Wheels (Classic Light Tank Bogies) -->
  <circle cx="6.5" cy="23.5" r="2.4" fill="#64748b" stroke="#0f172a" stroke-width="0.5"/>
  <circle cx="6.5" cy="23.5" r="0.8" fill="#cbd5e1"/>

  <circle cx="12" cy="23.5" r="2.4" fill="#64748b" stroke="#0f172a" stroke-width="0.5"/>
  <circle cx="12" cy="23.5" r="0.8" fill="#cbd5e1"/>

  <circle cx="17.5" cy="23.5" r="2.4" fill="#64748b" stroke="#0f172a" stroke-width="0.5"/>
  <circle cx="17.5" cy="23.5" r="0.8" fill="#cbd5e1"/>

  <circle cx="23" cy="23.5" r="2.4" fill="#64748b" stroke="#0f172a" stroke-width="0.5"/>
  <circle cx="23" cy="23.5" r="0.8" fill="#cbd5e1"/>
</svg>
