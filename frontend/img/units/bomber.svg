<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bomberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="b17Alum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bomberBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="19" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>

  <!-- Big Flight Wingspan (x=4 to x=124) -->
  <polygon points="64,48 4,64 6,76 64,68 122,76 124,64" fill="url(#b17Alum)" stroke="#0f172a" stroke-width="2"/>

  <!-- 4 Wright Radial Engines -->
  <rect x="18" y="56" width="10" height="18" rx="3" fill="#1e293b" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="23" cy="56" rx="11" ry="3" fill="#fef08a" opacity="0.9"/>
  <rect x="36" y="54" width="10" height="18" rx="3" fill="#1e293b" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="41" cy="54" rx="11" ry="3" fill="#fef08a" opacity="0.9"/>
  <rect x="82" y="54" width="10" height="18" rx="3" fill="#1e293b" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="87" cy="54" rx="11" ry="3" fill="#fef08a" opacity="0.9"/>
  <rect x="100" y="56" width="10" height="18" rx="3" fill="#1e293b" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="105" cy="56" rx="11" ry="3" fill="#fef08a" opacity="0.9"/>

  <!-- Heavy Fuselage (y=10 to y=120) -->
  <path d="M64 10 C58 10 56 22 56 54 L57 106 C57 116 64 122 64 122 C64 122 71 116 71 106 L72 54 C72 22 70 10 64 10 Z" fill="url(#b17Alum)" stroke="#0f172a" stroke-width="2"/>

  <!-- Greenhouse Glass Nose & Chin Turret -->
  <ellipse cx="64" cy="14" rx="5" ry="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
  <line x1="61" y1="4" x2="61" y2="12" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="67" y1="4" x2="67" y2="12" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dorsal Turret -->
  <circle cx="64" cy="44" r="5.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="61" y1="38" x2="61" y2="44" stroke="#000" stroke-width="2"/>
  <line x1="67" y1="38" x2="67" y2="44" stroke="#000" stroke-width="2"/>

  <!-- Tail Stabilizers -->
  <polygon points="64,106 36,116 38,122 64,118 90,122 92,116" fill="url(#b17Alum)" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="64" y1="84" x2="64" y2="118" stroke="#0f172a" stroke-width="3.5"/>
  <circle cx="64" cy="120" r="2.5" fill="#0f172a"/>

  <!-- US Star Insignia -->
  <circle cx="28" cy="67" r="7" fill="#1e3a8a"/>
  <polygon points="28,62 29.5,66 34,66 30.5,69 32,73 28,70.5 24,73 25.5,69 22,66 26.5,66" fill="#f8fafc"/>
</svg>