<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Truck Chassis Green -->
    <linearGradient id="rocketChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556947"/>
      <stop offset="100%" stop-color="#2d3826"/>
    </linearGradient>
    <!-- Steel Launch Rails -->
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Rocket Projectile Body (Military Olive / Dark Steel with Red Warhead) -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="warheadRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Launch Rails Rack (Angled 35 degrees pointing upper-left) -->
  <g transform="translate(16,16) rotate(-32) translate(-16,-16)">
    <!-- Rail Guide Beams (Parallel I-Beams) -->
    <rect x="2" y="10.5" width="22" height="1.4" fill="url(#railGrad)" stroke="#0f172a" stroke-width="0.5"/>
    <rect x="2" y="13.5" width="22" height="1.4" fill="url(#railGrad)" stroke="#0f172a" stroke-width="0.5"/>
    <rect x="2" y="16.5" width="22" height="1.4" fill="url(#railGrad)" stroke="#0f172a" stroke-width="0.5"/>
    <!-- Vertical Cross Braces -->
    <rect x="7" y="10" width="1.2" height="8.5" fill="#334155"/>
    <rect x="15" y="10" width="1.2" height="8.5" fill="#334155"/>
    <rect x="21" y="10" width="1.2" height="8.5" fill="#334155"/>

    <!-- Rocket Projectiles on Rails -->
    <!-- Rocket 1 (Top) -->
    <rect x="4" y="9.2" width="14" height="2" rx="0.5" fill="url(#rocketBody)" stroke="#0f172a" stroke-width="0.4"/>
    <polygon points="4,9.2 0.5,10.2 4,11.2" fill="url(#warheadRed)" stroke="#7f1d1d" stroke-width="0.4"/>
    <polygon points="17,8.2 19,9.2 19,11.2 17,12.2" fill="#334155"/>

    <!-- Rocket 2 (Middle) -->
    <rect x="4" y="12.2" width="14" height="2" rx="0.5" fill="url(#rocketBody)" stroke="#0f172a" stroke-width="0.4"/>
    <polygon points="4,12.2 0.5,13.2 4,14.2" fill="url(#warheadRed)" stroke="#7f1d1d" stroke-width="0.4"/>
    <polygon points="17,11.2 19,12.2 19,14.2 17,15.2" fill="#334155"/>

    <!-- Rocket 3 (Bottom) -->
    <rect x="4" y="15.2" width="14" height="2" rx="0.5" fill="url(#rocketBody)" stroke="#0f172a" stroke-width="0.4"/>
    <polygon points="4,15.2 0.5,16.2 4,17.2" fill="url(#warheadRed)" stroke="#7f1d1d" stroke-width="0.4"/>
    <polygon points="17,14.2 19,15.2 19,17.2 17,18.2" fill="#334155"/>
  </g>

  <!-- Hydraulic Elevation Strut / Support Frame -->
  <line x1="15" y1="18" x2="20" y2="23" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="25" y2="23" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Truck Cab (Forward / Left) -->
  <path d="M2 19 L2 23 L14 23 L14 17 L8 17 C6 17 4 18 2 19 Z" fill="url(#rocketChassis)" stroke="#1a2315" stroke-width="0.6"/>
  <rect x="5.5" y="18" width="3" height="3" fill="#bae6fd" stroke="#1a2315" stroke-width="0.4"/>
  <!-- Armored Rear Platform -->
  <rect x="13.5" y="21" width="16.5" height="2.5" fill="url(#rocketChassis)" stroke="#1a2315" stroke-width="0.6"/>

  <!-- Wheels -->
  <circle cx="6" cy="24.5" r="3.2" fill="#1e293b" stroke="#000" stroke-width="0.6"/>
  <circle cx="6" cy="24.5" r="1.4" fill="#475569"/>

  <circle cx="20" cy="24.5" r="3.2" fill="#1e293b" stroke="#000" stroke-width="0.6"/>
  <circle cx="20" cy="24.5" r="1.4" fill="#475569"/>

  <circle cx="26.5" cy="24.5" r="3.2" fill="#1e293b" stroke="#000" stroke-width="0.6"/>
  <circle cx="26.5" cy="24.5" r="1.4" fill="#475569"/>
</svg>
