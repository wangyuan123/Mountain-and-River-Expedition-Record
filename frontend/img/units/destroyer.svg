  <text x="18" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#f8fafc">445</text>

  <!-- Gun Mount 51 -->
  <path d="M20 70 L24 62 L32 62 L34 70 Z" fill="#475569" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="10" y1="64" x2="26" y2="64" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

