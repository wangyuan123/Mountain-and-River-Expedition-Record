  </defs>
  <rect width="128" height="128" rx="20" fill="url(#destBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="19" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.4"/>

  <!-- High-speed ocean bow waves & spray -->
