  <path d="M33 65 L36 57 L43 57 L45 65 Z" fill="#475569" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="22" y1="60" x2="36" y2="60" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bridge Pilot House & Radar Mast -->
