<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="crystalGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Outer stone base -->
  <path d="M 30,28 L 64,16 L 98,28 L 110,60 L 100,96 L 64,112 L 28,96 L 18,60 Z"
        fill="url(#stoneGrad)" stroke="#5a5a5a" stroke-width="1.5"/>
  <!-- Stone cracks -->
  <path d="M 22,72 L 30,80 L 26,90" fill="none" stroke="#888" stroke-width="0.6" opacity="0.6"/>
  <path d="M 100,40 L 106,52 L 102,62" fill="none" stroke="#888" stroke-width="0.6" opacity="0.6"/>
  <path d="M 36,98 L 44,104" fill="none" stroke="#888" stroke-width="0.6" opacity="0.6"/>
  <!-- Inner crystal cavity -->
  <path d="M 38,38 L 64,28 L 90,38 L 94,64 L 86,90 L 64,98 L 42,90 L 34,64 Z"
        fill="#1a1a1a" opacity="0.4"/>
  <!-- Main central crystal -->
  <path d="M 64,32 L 78,52 L 72,90 L 56,90 L 50,52 Z"
        fill="url(#crystalGrad)" stroke="#4c1d95" stroke-width="1"/>
  <path d="M 64,32 L 72,50 L 64,86 L 56,50 Z"
        fill="url(#crystalGradLight)" opacity="0.4"/>
  <!-- Left side crystal -->
  <path d="M 40,46 L 50,54 L 46,82 L 36,76 L 32,58 Z"
        fill="url(#crystalGrad)" stroke="#4c1d95" stroke-width="0.8"/>
  <!-- Right side crystal -->
  <path d="M 88,46 L 96,58 L 92,76 L 82,82 L 78,54 Z"
        fill="url(#crystalGrad)" stroke="#4c1d95" stroke-width="0.8"/>
  <!-- Front small crystal -->
  <path d="M 58,72 L 66,68 L 70,90 L 54,90 Z"
        fill="url(#crystalGradLight)" stroke="#4c1d95" stroke-width="0.6" opacity="0.9"/>
  <!-- Highlights -->
  <path d="M 64,34 L 67,48 L 64,72" fill="none" stroke="#f3e8ff" stroke-width="1" opacity="0.7"/>
  <path d="M 42,50 L 44,58" fill="none" stroke="#f3e8ff" stroke-width="0.8" opacity="0.6"/>
  <path d="M 90,50 L 92,60" fill="none" stroke="#f3e8ff" stroke-width="0.8" opacity="0.6"/>
</svg>
