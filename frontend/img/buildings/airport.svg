<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="airTower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="runwayG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Ground Runway / Tarmac Surface -->
  <polygon points="2,28 14,14 26,14 30,28" fill="url(#runwayG)" stroke="#0f172a" stroke-width="0.7"/>
  <!-- Runway Centerline Dashes -->
  <line x1="16" y1="28" x2="20" y2="14" stroke="#fde047" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Airfield Control Tower (Left) -->
  <!-- Tower Base -->
  <polygon points="5,15 11,15 12,28 4,28" fill="url(#airTower)" stroke="#0f172a" stroke-width="0.7"/>
  <!-- Windows on tower column -->
  <rect x="6.5" y="18" width="2" height="2" fill="#0f172a"/>
  <rect x="6.5" y="22" width="2" height="2" fill="#0f172a"/>

  <!-- Tower Observation Glass Cab -->
  <polygon points="3,11 13,11 11.5,15 4.5,15" fill="#38bdf8" stroke="#0f172a" stroke-width="0.7"/>
  <line x1="6.5" y1="11" x2="6" y2="15" stroke="#0f172a" stroke-width="0.5"/>
  <line x1="9.5" y1="11" x2="10" y2="15" stroke="#0f172a" stroke-width="0.5"/>

  <!-- Tower Flat Roof & Antenna Beacon -->
  <rect x="2.5" y="9.5" width="11" height="1.5" rx="0.5" fill="#1e293b"/>
  <!-- Rotating Beacon / Light -->
  <circle cx="8" cy="8.2" r="1.2" fill="#ef4444"/>
  <line x1="8" y1="9.5" x2="8" y2="4" stroke="#64748b" stroke-width="0.8"/>
  <line x1="6" y1="5.5" x2="10" y2="5.5" stroke="#64748b" stroke-width="0.6"/>

  <!-- Fighter Plane in Flight / Taking off (Right Top) -->
  <g transform="translate(21, 9) rotate(-22) scale(0.65)">
    <!-- Fuselage -->
    <path d="M0 -8 L1.5 6 L0 8 L-1.5 6 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="0.8"/>
    <!-- Cockpit -->
    <ellipse cx="0" cy="-2" rx="1" ry="2" fill="#38bdf8"/>
    <!-- Wings -->
    <polygon points="0,-1 11,3 10,6 0,2" fill="#94a3b8" stroke="#0f172a" stroke-width="0.8"/>
    <polygon points="0,-1 -11,3 -10,6 0,2" fill="#94a3b8" stroke="#0f172a" stroke-width="0.8"/>
    <!-- Tail Fin -->
    <polygon points="0,5 3.5,7.5 0,7.5" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
    <polygon points="0,5 -3.5,7.5 0,7.5" fill="#475569" stroke="#0f172a" stroke-width="0.6"/>
  </g>
</svg>
