<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="houseRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556b2f"/>
      <stop offset="40%" stop-color="#3b4d1f"/>
      <stop offset="100%" stop-color="#243112"/>
    </linearGradient>
    <linearGradient id="houseFacade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a9e70"/>
      <stop offset="100%" stop-color="#4a5a36"/>
    </linearGradient>
    <linearGradient id="houseBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Heavy Concrete Blast Berm Foundation -->
  <polygon points="2,28 30,28 28,25 4,25" fill="url(#houseBase)" stroke="#0f172a" stroke-width="0.7"/>

  <!-- Large Military Quonset Barracks Main Arched Body -->
  <path d="M3 25 C3 7 11 4 21 4 L28 8 C29.5 9 29.5 25 29.5 25 Z" fill="url(#houseRoof)" stroke="#17220a" stroke-width="0.8"/>

  <!-- Barracks Corrugated Seams -->
  <path d="M9 4.8 C9.5 12 10 25 10 25" stroke="#1d2710" stroke-width="0.8" fill="none"/>
  <path d="M14 4.3 C14.5 12 15 25 15 25" stroke="#1d2710" stroke-width="0.8" fill="none"/>
  <path d="M19 4.3 C19.5 12 20 25 20 25" stroke="#1d2710" stroke-width="0.8" fill="none"/>
  <path d="M24 5.5 C24.5 12 25 25 25 25" stroke="#1d2710" stroke-width="0.8" fill="none"/>

  <!-- Front Semi-Circular End Facade -->
  <path d="M3 25 C3 7 12 7 12 25 Z" fill="url(#houseFacade)" stroke="#17220a" stroke-width="0.7"/>

  <!-- Troop Entrance Doorway with Steel Frame -->
  <path d="M5.5 25 L5.5 14 Q7.5 12.5 9.5 14 L9.5 25 Z" fill="#0f172a"/>
  <!-- Door Warning Lamp -->
  <circle cx="7.5" cy="11.5" r="1.1" fill="#fde047"/>
  <!-- Step Sill -->
  <rect x="5" y="24.5" width="5" height="1.2" fill="#94a3b8"/>

  <!-- Side Windows with Protective Louvers -->
  <rect x="13.5" y="11" width="4.5" height="5" rx="0.5" fill="#1e293b" stroke="#17220a" stroke-width="0.5"/>
  <rect x="14.2" y="11.8" width="3.1" height="3.4" fill="#38bdf8" opacity="0.85"/>
  <line x1="13.5" y1="13.5" x2="18" y2="13.5" stroke="#17220a" stroke-width="0.5"/>

  <!-- Roof Stovepipe / Ventilation Chimney -->
  <rect x="17" y="1.5" width="2" height="3.5" fill="#334155" stroke="#0f172a" stroke-width="0.5"/>
  <ellipse cx="18" cy="1.5" rx="1.5" ry="0.6" fill="#64748b"/>

  <!-- Military Chevron Badges on Barracks Wall -->
  <path d="M22 12 L25 15 L28 12" fill="none" stroke="#facc15" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M22 15.5 L25 18.5 L28 15.5" fill="none" stroke="#facc15" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M22 19 L25 22 L28 19" fill="none" stroke="#facc15" stroke-width="1.4" stroke-linecap="round"/>
</svg>
