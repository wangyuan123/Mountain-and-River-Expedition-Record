<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="wallStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78716c"/>
      <stop offset="50%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="wallTower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57534e"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
  </defs>

  <!-- Ground Line & Barbed Wire Base -->
  <rect x="2" y="27" width="28" height="3" fill="#1c1917"/>

  <!-- Main Wall Rampart -->
  <polygon points="6,27 26,27 26,13 6,13" fill="url(#wallStone)" stroke="#1c1917" stroke-width="0.8"/>
  <!-- Wall crenellations / battlements (center wall) -->
  <rect x="9" y="10" width="3.5" height="3.5" fill="#57534e" stroke="#1c1917" stroke-width="0.6"/>
  <rect x="14.2" y="10" width="3.5" height="3.5" fill="#57534e" stroke="#1c1917" stroke-width="0.6"/>
  <rect x="19.5" y="10" width="3.5" height="3.5" fill="#57534e" stroke="#1c1917" stroke-width="0.6"/>

  <!-- Left Flanking Bastion Tower -->
  <polygon points="3,27 7.5,27 7.5,9 3,9" fill="url(#wallTower)" stroke="#1c1917" stroke-width="0.8"/>
  <rect x="2.5" y="6.5" width="2.5" height="2.8" fill="#44403c"/>
  <rect x="5.5" y="6.5" width="2.5" height="2.8" fill="#44403c"/>
  <!-- Left embrasure / arrow slit -->
  <rect x="4.8" y="13" width="1" height="4" fill="#0c0a09"/>

  <!-- Right Flanking Bastion Tower -->
  <polygon points="24.5,27 29,27 29,9 24.5,9" fill="url(#wallTower)" stroke="#1c1917" stroke-width="0.8"/>
  <rect x="24" y="6.5" width="2.5" height="2.8" fill="#44403c"/>
  <rect x="27" y="6.5" width="2.5" height="2.8" fill="#44403c"/>
  <!-- Right embrasure / arrow slit -->
  <rect x="26.2" y="13" width="1" height="4" fill="#0c0a09"/>

  <!-- Center Heavy Fortified Portcullis / Gate -->
  <path d="M12 27 L12 20 C12 17.5 20 17.5 20 20 L20 27 Z" fill="#1c1917"/>
  <!-- Iron portcullis bars -->
  <line x1="14" y1="18.5" x2="14" y2="27" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="16" y1="18" x2="16" y2="27" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="18" y1="18.5" x2="18" y2="27" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="12" y1="22" x2="20" y2="22" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="12" y1="25" x2="20" y2="25" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Shield Crest above Gate -->
  <polygon points="16,14 18,15.5 17.2,18 16,19 14.8,18 14,15.5" fill="#b91c1c" stroke="#f59e0b" stroke-width="0.5"/>
</svg>
