<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="hfArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fireG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Heavy Heavy Industrial Structure -->
  <!-- Blast Furnace Chimney (Right) -->
  <polygon points="23,4 27,4 28,15 22,15" fill="#1e293b" stroke="#000000" stroke-width="0.6"/>
  <!-- Molten Fire Glow at Chimney Top -->
  <ellipse cx="25" cy="4" rx="2" ry="0.8" fill="url(#fireG)"/>

  <!-- Foundry Main Structure -->
  <polygon points="3,11 19,7 23,11 29,11 29,28 3,28" fill="url(#hfArmor)" stroke="#020617" stroke-width="0.8"/>

  <!-- Reinforced Girders / Armor Truss on Roof -->
  <polygon points="3,11 19,7 19,9 5,12" fill="#64748b"/>
  <line x1="7" y1="10" x2="7" y2="15" stroke="#1e293b" stroke-width="0.6"/>
  <line x1="12" y1="8.5" x2="12" y2="15" stroke="#1e293b" stroke-width="0.6"/>
  <line x1="17" y1="7.5" x2="17" y2="15" stroke="#1e293b" stroke-width="0.6"/>

  <!-- High Foundry Arch with Heavy Tank Turret & Long Cannon Silhouette -->
  <rect x="6" y="16" width="16" height="12" rx="1" fill="#020617"/>
  <!-- Molten Foundry Orange Glow from inside -->
  <path d="M7 26 C9 24 19 24 21 26 L21 28 L7 28 Z" fill="url(#fireG)" opacity="0.85"/>

  <!-- Heavy Tank Profile Silhouette in Front of Forge -->
  <!-- Long Barrel -->
  <rect x="2" y="19.5" width="10" height="1.6" fill="#94a3b8" stroke="#000" stroke-width="0.4"/>
  <rect x="1.5" y="19" width="1.8" height="2.6" fill="#cbd5e1"/>
  <!-- Heavy Turret -->
  <path d="M10 19 C10 17 13 16.5 17 16.5 C20 16.5 21 17.5 21 22 L10 22 Z" fill="#475569" stroke="#000" stroke-width="0.5"/>
  <!-- Heavy Chassis & Tracks -->
  <rect x="9" y="22" width="13" height="4.5" rx="1" fill="#1e293b" stroke="#000" stroke-width="0.5"/>
  <circle cx="11.5" cy="24.2" r="1.4" fill="#64748b"/>
  <circle cx="15.5" cy="24.2" r="1.4" fill="#64748b"/>
  <circle cx="19.5" cy="24.2" r="1.4" fill="#64748b"/>

  <!-- Heavy Gantry Crane Rail on Right -->
  <rect x="23" y="16" width="5" height="11" fill="#1e293b" stroke="#020617" stroke-width="0.5"/>
  <line x1="23" y1="16" x2="28" y2="21" stroke="#f59e0b" stroke-width="0.8"/>
  <line x1="28" y1="16" x2="23" y2="21" stroke="#f59e0b" stroke-width="0.8"/>
</svg>
