<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="radarBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="radarDish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Fortified Concrete Bunker Base -->
  <polygon points="5,28 27,28 24,21 8,21" fill="url(#radarBase)" stroke="#334155" stroke-width="0.8"/>
  <rect x="13.5" y="24" width="5" height="4" fill="#0f172a"/>
  <!-- Steel Lattice Mast / Pedestal -->
  <line x1="12" y1="21" x2="15" y2="14" stroke="#64748b" stroke-width="1.2"/>
  <line x1="20" y1="21" x2="17" y2="14" stroke="#64748b" stroke-width="1.2"/>
  <line x1="12" y1="18" x2="20" y2="18" stroke="#475569" stroke-width="1"/>
  <line x1="13" y1="15.5" x2="19" y2="15.5" stroke="#475569" stroke-width="1"/>
  <!-- Turret Mount Platform -->
  <rect x="14" y="13" width="4" height="2" rx="0.5" fill="#334155"/>

  <!-- Parabolic Radar Dish (Angled up and to the right) -->
  <path d="M11 16 C8 11 12 5 17 5 C19.5 5 21 6.5 22 8 C18 8.5 14 11.5 13 16 Z" fill="url(#radarDish)" stroke="#334155" stroke-width="0.8"/>
  <!-- Feed Horn Boom & Subreflector -->
  <line x1="15" y1="11" x2="21" y2="8" stroke="#0f172a" stroke-width="1"/>
  <circle cx="21" cy="8" r="1.2" fill="#ef4444"/>

  <!-- Radar Microwave Signal Waves (Emitting toward upper-right) -->
  <path d="M23 5 C25 6.5 26 8.5 26 11" fill="none" stroke="#22c55e" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M26 3 C28.5 5.5 29.5 8.5 29.5 12" fill="none" stroke="#22c55e" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.5,1"/>
  <path d="M29 1 C32 4.5 32.5 9 32 13" fill="none" stroke="#16a34a" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
