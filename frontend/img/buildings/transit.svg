<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="truckOlive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="truckCanvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>

  <!-- Ground / Road with Center Dash -->
  <rect x="2" y="27" width="28" height="3" fill="#1e293b"/>
  <line x1="4" y1="28.5" x2="10" y2="28.5" stroke="#facc15" stroke-width="0.8"/>
  <line x1="13" y1="28.5" x2="19" y2="28.5" stroke="#facc15" stroke-width="0.8"/>
  <line x1="22" y1="28.5" x2="28" y2="28.5" stroke="#facc15" stroke-width="0.8"/>

  <!-- Transport Bay Canopy / Shelter (Top/Back) -->
  <polygon points="2,6 30,6 27,10 5,10" fill="#334155" stroke="#1e293b" stroke-width="0.6"/>
  <line x1="5" y1="10" x2="5" y2="27" stroke="#475569" stroke-width="1.2"/>
  <line x1="27" y1="10" x2="27" y2="27" stroke="#475569" stroke-width="1.2"/>

  <!-- Military Cargo Truck Silhouette (Side profile facing right) -->
  <!-- Cargo Bed / Canvas Cover -->
  <path d="M4 12 L18 12 L18 22 L4 22 Z" fill="url(#truckCanvas)" stroke="#27272a" stroke-width="0.8"/>
  <!-- Canvas rib seams -->
  <line x1="7.5" y1="12" x2="7.5" y2="22" stroke="#3f3f46" stroke-width="0.8"/>
  <line x1="11" y1="12" x2="11" y2="22" stroke="#3f3f46" stroke-width="0.8"/>
  <line x1="14.5" y1="12" x2="14.5" y2="22" stroke="#3f3f46" stroke-width="0.8"/>

  <!-- Truck Cab -->
  <path d="M18 15 L22 15 L25 18 L27 18 L27 22 L18 22 Z" fill="url(#truckOlive)" stroke="#1a2e05" stroke-width="0.8"/>
  <!-- Windshield -->
  <polygon points="19,16 21.5,16 24,18 19,18" fill="#38bdf8" opacity="0.9"/>
  <!-- Front Headlight -->
  <rect x="26.5" y="19.5" width="1.2" height="2" fill="#fef08a"/>
  <!-- Military Star on Door -->
  <polygon points="21,19.5 21.4,20.3 22.2,20.4 21.6,21 21.8,21.8 21,21.3 20.2,21.8 20.4,21 19.8,20.4 20.6,20.3" fill="#ffffff"/>

  <!-- Chassis Beam -->
  <rect x="5" y="22" width="22" height="2" fill="#0f172a"/>

  <!-- Heavy Off-road Wheels -->
  <!-- Wheel 1 (Front) -->
  <circle cx="23.5" cy="24.5" r="3.2" fill="#18181b"/>
  <circle cx="23.5" cy="24.5" r="1.5" fill="#71717a"/>
  <!-- Wheel 2 (Rear outer) -->
  <circle cx="14" cy="24.5" r="3.2" fill="#18181b"/>
  <circle cx="14" cy="24.5" r="1.5" fill="#71717a"/>
  <!-- Wheel 3 (Rear inner) -->
  <circle cx="7.5" cy="24.5" r="3.2" fill="#18181b"/>
  <circle cx="7.5" cy="24.5" r="1.5" fill="#71717a"/>
</svg>
