<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="exchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="exchBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Exchange Pillar / Pedestal Base -->
  <polygon points="10,29 22,29 20,25 12,25" fill="url(#exchGold)" stroke="#78350f" stroke-width="0.6"/>
  <!-- Central Brass Balance Mast -->
  <rect x="15" y="6" width="2" height="19" rx="0.5" fill="url(#exchGold)"/>
  <circle cx="16" cy="6" r="2.2" fill="url(#exchGold)"/>
  <circle cx="16" cy="6" r="1" fill="#78350f"/>

  <!-- Tilted Brass Beam -->
  <line x1="6" y1="10" x2="26" y2="12" stroke="url(#exchGold)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left Scale Pan (Higher - Ammo / Munitions) -->
  <line x1="6" y1="10" x2="3.5" y2="17" stroke="#ca8a04" stroke-width="0.8"/>
  <line x1="6" y1="10" x2="8.5" y2="17" stroke="#ca8a04" stroke-width="0.8"/>
  <path d="M3 17 C3 19 9 19 9 17 Z" fill="url(#exchGold)" stroke="#78350f" stroke-width="0.6"/>
  <!-- Ammo projectile / ingot in left pan -->
  <polygon points="6,13 4.5,17 7.5,17" fill="#dc2626"/>

  <!-- Right Scale Pan (Lower - Gold / Energy) -->
  <line x1="26" y1="12" x2="23.5" y2="19" stroke="#ca8a04" stroke-width="0.8"/>
  <line x1="26" y1="12" x2="28.5" y2="19" stroke="#ca8a04" stroke-width="0.8"/>
  <path d="M23 19 C23 21 29 21 29 19 Z" fill="url(#exchGold)" stroke="#78350f" stroke-width="0.6"/>
  <!-- Gold Coins / Ingot in right pan -->
  <circle cx="26" cy="18" r="1.5" fill="#facc15" stroke="#ca8a04" stroke-width="0.5"/>

  <!-- Dual Resource Exchange Arrows (Curving around center) -->
  <!-- Upper arrow (left to right) -->
  <path d="M11 5 C13 3 19 3 21 5" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="21,3 23,5.5 20.5,6.5" fill="#38bdf8"/>

  <!-- Lower arrow (right to left) -->
  <path d="M21 23 C19 25 13 25 11 23" fill="none" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="11,25 9,22.5 11.5,21.5" fill="#22c55e"/>
</svg>
