<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="staffGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="staffShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Crossed Golden Field Marshal Batons (Background) -->
  <line x1="5" y1="5" x2="27" y2="27" stroke="url(#staffGold)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="5" cy="5" r="1.8" fill="url(#staffGold)"/>
  <circle cx="27" cy="27" r="1.8" fill="url(#staffGold)"/>

  <line x1="27" y1="5" x2="5" y2="27" stroke="url(#staffGold)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="27" cy="5" r="1.8" fill="url(#staffGold)"/>
  <circle cx="5" cy="27" r="1.8" fill="url(#staffGold)"/>

  <!-- Tactical Command Shield -->
  <path d="M7 6 L25 6 L25 15 C25 22 16 27 16 27 C16 27 7 22 7 15 Z" fill="url(#staffShield)" stroke="url(#staffGold)" stroke-width="1.2"/>

  <!-- Laurel Wreath Trim Inside Shield -->
  <path d="M10 16 C10 19 12 22 16 24 C20 22 22 19 22 16" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="1.5,1.5"/>

  <!-- 4 Stars of High General Command -->
  <!-- Top Center Big Star -->
  <polygon points="16,8 16.8,10 19,10.2 17.3,11.5 17.8,13.6 16,12.4 14.2,13.6 14.7,11.5 13,10.2 15.2,10" fill="url(#staffGold)"/>
  <!-- Left Star -->
  <polygon points="11,13.5 11.5,14.8 13,15 11.8,15.8 12.2,17.2 11,16.4 9.8,17.2 10.2,15.8 9,15 10.5,14.8" fill="url(#staffGold)"/>
  <!-- Right Star -->
  <polygon points="21,13.5 21.5,14.8 23,15 21.8,15.8 22.2,17.2 21,16.4 19.8,17.2 20.2,15.8 19,15 20.5,14.8" fill="url(#staffGold)"/>
  <!-- Bottom Center Star -->
  <polygon points="16,16 16.6,17.3 18,17.5 16.9,18.3 17.3,19.7 16,18.9 14.7,19.7 15.1,18.3 14,17.5 15.4,17.3" fill="url(#staffGold)"/>
</svg>
