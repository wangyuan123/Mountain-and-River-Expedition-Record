<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cmdRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cmdWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="cmdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Flagpole & Red Commander Pennant -->
  <line x1="16" y1="2" x2="16" y2="7" stroke="#cbd5e1" stroke-width="0.8"/>
  <polygon points="16,2.5 21,4 16,5.5" fill="#dc2626"/>

  <!-- Pediment / Classical Triangular Roof -->
  <polygon points="16,7 4,13 28,13" fill="url(#cmdRoof)" stroke="#0f172a" stroke-width="0.7"/>
  <!-- Gold Star Crest in Pediment -->
  <polygon points="16,8.5 16.8,10.2 18.6,10.3 17.2,11.4 17.7,13.1 16,12.1 14.3,13.1 14.8,11.4 13.4,10.3 15.2,10.2" fill="url(#cmdGold)"/>

  <!-- Cornice Beam -->
  <rect x="5" y="13" width="22" height="1.8" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>

  <!-- Main Building Body & Pillars -->
  <rect x="6" y="14.8" width="20" height="12.2" fill="url(#cmdWall)" stroke="#1e293b" stroke-width="0.6"/>
  <!-- Columns (4 Pillars) -->
  <rect x="8" y="14.8" width="2" height="12.2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.4"/>
  <rect x="12" y="14.8" width="2" height="12.2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.4"/>
  <rect x="18" y="14.8" width="2" height="12.2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.4"/>
  <rect x="22" y="14.8" width="2" height="12.2" fill="#f1f5f9" stroke="#64748b" stroke-width="0.4"/>

  <!-- Central Double Doors with Arch -->
  <path d="M14 27 L14 20 Q16 18.5 18 20 L18 27 Z" fill="#1e293b" stroke="#0f172a" stroke-width="0.5"/>
  <line x1="16" y1="19" x2="16" y2="27" stroke="#475569" stroke-width="0.5"/>

  <!-- Base Steps / Foundation -->
  <rect x="3" y="27" width="26" height="2" fill="#334155" stroke="#0f172a" stroke-width="0.6"/>
  <rect x="2" y="29" width="28" height="2" fill="#1e293b" stroke="#0f172a" stroke-width="0.6"/>
</svg>
