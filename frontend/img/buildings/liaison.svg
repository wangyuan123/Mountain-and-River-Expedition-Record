<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="liaisonBunker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="signalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Fortified Communications Bunker -->
  <polygon points="5,28 27,28 25,20 7,20" fill="url(#liaisonBunker)" stroke="#475569" stroke-width="0.8"/>
  <rect x="13.5" y="22" width="5" height="6" fill="#020617"/>
  <!-- Comm window slit with green phosphorescent light -->
  <rect x="8.5" y="22" width="3" height="2" fill="#22c55e"/>
  <rect x="20.5" y="22" width="3" height="2" fill="#22c55e"/>

  <!-- High-Gain Lattice Antenna Mast (Center) -->
  <line x1="16" y1="5" x2="16" y2="20" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="11" y1="20" x2="16" y2="9" stroke="#64748b" stroke-width="1"/>
  <line x1="21" y1="20" x2="16" y2="9" stroke="#64748b" stroke-width="1"/>
  <line x1="12.5" y1="16" x2="19.5" y2="16" stroke="#64748b" stroke-width="1"/>
  <line x1="14" y1="12" x2="18" y2="12" stroke="#64748b" stroke-width="1"/>

  <!-- Antenna Crossbars & Tip -->
  <line x1="10" y1="7" x2="22" y2="7" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="10" cy="7" r="1" fill="#ef4444"/>
  <circle cx="22" cy="7" r="1" fill="#ef4444"/>
  <circle cx="16" cy="4" r="1.5" fill="#ef4444"/>

  <!-- Radio Frequency Broadcast Waves / Lightning Signals -->
  <path d="M12 4 C9 4 7 7 7 10" fill="none" stroke="url(#signalGold)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M20 4 C23 4 25 7 25 10" fill="none" stroke="url(#signalGold)" stroke-width="1.2" stroke-linecap="round"/>

  <path d="M9 2 C5 3 4 7 4 12" fill="none" stroke="url(#signalGold)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2,1.5"/>
  <path d="M23 2 C27 3 28 7 28 12" fill="none" stroke="url(#signalGold)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2,1.5"/>

  <!-- Tactical Lightning Bolt across base -->
  <polygon points="17,11 14.5,15 16.2,15 15,19 18.5,14.5 16.5,14.5" fill="#38bdf8"/>
</svg>
