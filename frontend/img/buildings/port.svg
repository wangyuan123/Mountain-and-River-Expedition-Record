<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="seaWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shipSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Ocean Water Base -->
  <rect x="0" y="22" width="32" height="10" fill="url(#seaWater)"/>
  <!-- Gentle Wave Lines -->
  <path d="M1 25 Q4 23 8 25 Q12 27 16 25 Q20 23 24 25 Q28 27 31 25" fill="none" stroke="#38bdf8" stroke-width="0.7"/>
  <path d="M3 28 Q7 26 11 28 Q15 30 19 28 Q23 26 27 28" fill="none" stroke="#7dd3fc" stroke-width="0.5"/>

  <!-- Concrete Pier / Quay Structure (Left to Center) -->
  <polygon points="0,17 14,17 14,24 0,24" fill="#64748b" stroke="#0f172a" stroke-width="0.7"/>
  <!-- Quay bollards -->
  <rect x="2" y="15.5" width="1.5" height="2" fill="#1e293b"/>
  <rect x="8" y="15.5" width="1.5" height="2" fill="#1e293b"/>
  <rect x="12" y="15.5" width="1.5" height="2" fill="#1e293b"/>

  <!-- Dockside Heavy Crane (Left) -->
  <polygon points="3,17 5,17 7,7 4,7" fill="#f59e0b" stroke="#78350f" stroke-width="0.5"/>
  <line x1="6" y1="7" x2="15" y2="4" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="15" y1="4" x2="15" y2="11" stroke="#334155" stroke-width="0.6"/>
  <polygon points="14,11 16,11 15,12.5" fill="#334155"/>

  <!-- Warship Hull in Berth (Right) -->
  <!-- Main Hull -->
  <path d="M12 21 L28 21 C30.5 21 32 19 32 19 L30 24 L13 24 Z" fill="url(#shipSteel)" stroke="#0f172a" stroke-width="0.7"/>
  <!-- Superstructure & Bridge Tower -->
  <rect x="16" y="15" width="8" height="6" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.6"/>
  <rect x="18" y="12" width="4" height="3" fill="#94a3b8" stroke="#0f172a" stroke-width="0.5"/>
  <!-- Mast & Radar -->
  <line x1="20" y1="12" x2="20" y2="7" stroke="#475569" stroke-width="0.7"/>
  <line x1="18" y1="9" x2="22" y2="9" stroke="#475569" stroke-width="0.5"/>

  <!-- Forward Gun Turret & Barrel -->
  <rect x="25" y="18" width="4" height="3" rx="1" fill="#475569" stroke="#0f172a" stroke-width="0.5"/>
  <line x1="28" y1="19.5" x2="32" y2="18.5" stroke="#1e293b" stroke-width="1"/>
</svg>
