<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="depotRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="crateWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="ammoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Warehouse Main Structure -->
  <polygon points="16,3.5 29.5,9.5 29.5,27.5 2.5,27.5 2.5,9.5" fill="url(#depotRoof)" stroke="#0f172a" stroke-width="0.8"/>
  <polygon points="16,3.5 29.5,9.5 2.5,9.5" fill="#64748b"/>
  <!-- Corrugated roof lines -->
  <line x1="7" y1="9.5" x2="16" y2="3.5" stroke="#334155" stroke-width="0.8"/>
  <line x1="11.5" y1="9.5" x2="16" y2="3.5" stroke="#334155" stroke-width="0.8"/>
  <line x1="20.5" y1="9.5" x2="16" y2="3.5" stroke="#334155" stroke-width="0.8"/>
  <line x1="25" y1="9.5" x2="16" y2="3.5" stroke="#334155" stroke-width="0.8"/>

  <!-- Concrete Base Foundation -->
  <rect x="2" y="27" width="28" height="2" fill="#0f172a"/>

  <!-- Metal Rolling Shutter Cargo Door (Left) -->
  <rect x="5" y="12" width="11" height="15" fill="#1e293b" stroke="#0f172a" stroke-width="0.8"/>
  <line x1="5" y1="14.5" x2="16" y2="14.5" stroke="#475569" stroke-width="0.8"/>
  <line x1="5" y1="17" x2="16" y2="17" stroke="#475569" stroke-width="0.8"/>
  <line x1="5" y1="19.5" x2="16" y2="19.5" stroke="#475569" stroke-width="0.8"/>
  <line x1="5" y1="22" x2="16" y2="22" stroke="#475569" stroke-width="0.8"/>
  <line x1="5" y1="24.5" x2="16" y2="24.5" stroke="#475569" stroke-width="0.8"/>

  <!-- Stacked Wooden Munitions Crate 1 (Bottom Right) -->
  <rect x="18" y="17" width="10" height="10" fill="url(#crateWood)" stroke="#451a03" stroke-width="0.8"/>
  <line x1="18" y1="17" x2="28" y2="27" stroke="#fbbf24" stroke-width="0.8"/>
  <line x1="28" y1="17" x2="18" y2="27" stroke="#fbbf24" stroke-width="0.8"/>

  <!-- Stacked Ammo Crate 2 (Top of Crate 1) -->
  <rect x="19.5" y="10.5" width="8" height="6.5" fill="url(#ammoGreen)" stroke="#052e16" stroke-width="0.8"/>
  <circle cx="23.5" cy="13.7" r="1.3" fill="#facc15"/>

  <!-- Warning Hazard Stripe over Door -->
  <rect x="5" y="11" width="11" height="1.2" fill="#eab308"/>
</svg>
