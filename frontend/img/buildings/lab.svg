<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="labBunker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="labCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Fortified Concrete Lab Base -->
  <polygon points="4,28 28,28 26,20 6,20" fill="url(#labBunker)" stroke="#64748b" stroke-width="0.8"/>
  <line x1="10" y1="23" x2="22" y2="23" stroke="#94a3b8" stroke-width="0.8"/>
  <!-- Base status LEDs -->
  <circle cx="9" cy="25.5" r="1" fill="#22c55e"/>
  <circle cx="13" cy="25.5" r="1" fill="#38bdf8"/>
  <circle cx="17" cy="25.5" r="1" fill="#f59e0b"/>

  <!-- Science Flask / Atomic Reactor Silhouette -->
  <!-- Flask neck -->
  <rect x="13" y="7" width="6" height="5" fill="#e2e8f0" stroke="#475569" stroke-width="0.8"/>
  <rect x="12" y="5" width="8" height="2.5" rx="1" fill="#94a3b8"/>
  <!-- Flask body -->
  <path d="M13 12 L7 20 L25 20 L19 12 Z" fill="#e2e8f0" stroke="#475569" stroke-width="0.8"/>
  <!-- Glowing Plasma inside Flask -->
  <path d="M9.2 17 L22.8 17 L24.5 19.5 L7.5 19.5 Z" fill="url(#flaskLiquid)"/>
  <circle cx="14" cy="18" r="0.8" fill="#e0f2fe"/>
  <circle cx="18" cy="18.2" r="0.6" fill="#e0f2fe"/>

  <!-- Atomic Energy Rings around Lab Top -->
  <ellipse cx="16" cy="11" rx="9" ry="3.2" fill="none" stroke="url(#labCyan)" stroke-width="1.2" transform="rotate(-25 16 11)"/>
  <ellipse cx="16" cy="11" rx="9" ry="3.2" fill="none" stroke="url(#labCyan)" stroke-width="1.2" transform="rotate(25 16 11)"/>
  <circle cx="16" cy="11" r="1.8" fill="#38bdf8"/>

  <!-- Orbiting electrons -->
  <circle cx="7.5" cy="8.5" r="1" fill="#facc15"/>
  <circle cx="24.5" cy="8.5" r="1" fill="#facc15"/>
</svg>
