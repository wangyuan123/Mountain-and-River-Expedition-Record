<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="lfRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lfArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Industrial Shed Roof -->
  <polygon points="3,12 16,6 29,12 29,28 3,28" fill="url(#lfArmor)" stroke="#0f172a" stroke-width="0.7"/>
  <polygon points="2,12 16,5 30,12 28,14 16,8 4,14" fill="url(#lfRoof)" stroke="#0f172a" stroke-width="0.5"/>

  <!-- Light Tank Silhouette emerging from workshop -->
  <rect x="8" y="16" width="16" height="12" fill="#0f172a"/>
  <!-- Crane Rail Hook -->
  <line x1="16" y1="9" x2="16" y2="15" stroke="#fbbf24" stroke-width="0.8"/>
  <circle cx="16" cy="15.5" r="1" fill="#f59e0b"/>

  <!-- Light Tank Front / Silhouette inside hangar -->
  <polygon points="9,27 10,23 22,23 23,27" fill="#647452" stroke="#2d3524" stroke-width="0.6"/>
  <!-- Tank Turret & Gun Barrel -->
  <ellipse cx="16" cy="22" rx="4" ry="2.2" fill="#4a593c" stroke="#2d3524" stroke-width="0.5"/>
  <rect x="7.5" y="21.3" width="6" height="1.4" fill="#334155" stroke="#0f172a" stroke-width="0.4"/>
  <!-- Headlights -->
  <circle cx="11.5" cy="24" r="0.8" fill="#fef08a"/>
  <circle cx="20.5" cy="24" r="0.8" fill="#fef08a"/>

  <!-- Wrench & Gear Insignia in Gable -->
  <g transform="translate(16, 11) scale(0.65)">
    <circle cx="0" cy="0" r="4.5" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#1e293b"/>
    <!-- Cog teeth -->
    <rect x="-1" y="-6" width="2" height="12" fill="#f59e0b"/>
    <rect x="-6" y="-1" width="12" height="2" fill="#f59e0b"/>
  </g>

  <!-- Hazard Stripes Over Door -->
  <g>
    <rect x="8" y="15.2" width="16" height="1.5" fill="#eab308"/>
    <line x1="10" y1="15.2" x2="11.5" y2="16.7" stroke="#000000" stroke-width="1.2"/>
    <line x1="14" y1="15.2" x2="15.5" y2="16.7" stroke="#000000" stroke-width="1.2"/>
    <line x1="18" y1="15.2" x2="19.5" y2="16.7" stroke="#000000" stroke-width="1.2"/>
    <line x1="22" y1="15.2" x2="23.5" y2="16.7" stroke="#000000" stroke-width="1.2"/>
  </g>
</svg>
