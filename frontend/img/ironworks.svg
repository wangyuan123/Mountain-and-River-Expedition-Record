<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iwSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8c0c8"/>
      <stop offset="100%" stop-color="#d8d4c8"/>
    </linearGradient>
    <linearGradient id="iwBuilding" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a4a30"/>
      <stop offset="100%" stop-color="#3a2418"/>
    </linearGradient>
    <linearGradient id="iwChimney" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="iwSmoke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a0a0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e0e0e0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="iwGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4a3a"/>
      <stop offset="100%" stop-color="#2a1a10"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" fill="url(#iwSky)" rx="8"/>
  <!-- Distant mountains -->
  <path d="M 0,55 L 25,38 L 50,55 L 80,32 L 110,52 L 128,42 L 128,75 L 0,75 Z" fill="#6a6a6a" opacity="0.4"/>
  <!-- Ground -->
  <path d="M 0,108 Q 64,102 128,108 L 128,128 L 0,128 Z" fill="url(#iwGround)"/>
  <!-- Building base -->
  <rect x="20" y="55" width="88" height="55" fill="url(#iwBuilding)" stroke="#1a0f08" stroke-width="1"/>
  <!-- Roof -->
  <path d="M 18,55 L 64,38 L 110,55 Z" fill="#3a2418" stroke="#1a0f08" stroke-width="1"/>
  <!-- Chimneys -->
  <rect x="36" y="32" width="10" height="20" fill="url(#iwChimney)" stroke="#1a0f08" stroke-width="0.8"/>
  <rect x="78" y="36" width="9" height="18" fill="url(#iwChimney)" stroke="#1a0f08" stroke-width="0.8"/>
  <!-- Chimney tops -->
  <rect x="34" y="30" width="14" height="3" fill="#1a0f08"/>
  <rect x="76" y="34" width="13" height="3" fill="#1a0f08"/>
  <!-- Smoke -->
  <ellipse cx="41" cy="20" rx="6" ry="3" fill="url(#iwSmoke)"/>
  <ellipse cx="46" cy="12" rx="7" ry="3.5" fill="url(#iwSmoke)"/>
  <ellipse cx="82" cy="22" rx="5" ry="2.5" fill="url(#iwSmoke)"/>
  <ellipse cx="88" cy="14" rx="6" ry="3" fill="url(#iwSmoke)"/>
  <!-- Windows (orange glow) -->
  <rect x="28" y="65" width="8" height="8" fill="#ffa84a" stroke="#1a0f08" stroke-width="0.5"/>
  <rect x="42" y="65" width="8" height="8" fill="#ffa84a" stroke="#1a0f08" stroke-width="0.5"/>
  <rect x="56" y="65" width="8" height="8" fill="#ffa84a" stroke="#1a0f08" stroke-width="0.5"/>
  <rect x="70" y="65" width="8" height="8" fill="#ffa84a" stroke="#1a0f08" stroke-width="0.5"/>
  <rect x="84" y="65" width="8" height="8" fill="#ffa84a" stroke="#1a0f08" stroke-width="0.5"/>
  <rect x="98" y="65" width="8" height="8" fill="#ffa84a" stroke="#1a0f08" stroke-width="0.5"/>
  <!-- Door (large furnace entrance) -->
  <rect x="56" y="85" width="20" height="25" fill="#1a0f08" stroke="#0a0604" stroke-width="0.8"/>
  <ellipse cx="66" cy="95" rx="6" ry="2" fill="#ffa84a" opacity="0.8"/>
  <!-- Furnace glow at base -->
  <ellipse cx="66" cy="105" rx="20" ry="3" fill="#ff6a1a" opacity="0.5"/>
  <ellipse cx="64" cy="100" rx="4" ry="3" fill="#ffaa50"/>
  <!-- Metal beams (structural) -->
  <rect x="20" y="50" width="88" height="2" fill="#1a0f08" opacity="0.6"/>
  <rect x="20" y="80" width="88" height="1.5" fill="#1a0f08" opacity="0.5"/>
  <!-- Stacks of steel ingots (left) -->
  <rect x="22" y="100" width="6" height="8" fill="#708090" stroke="#1a0f08" stroke-width="0.4"/>
  <rect x="28" y="100" width="6" height="8" fill="#708090" stroke="#1a0f08" stroke-width="0.4"/>
  <rect x="34" y="100" width="6" height="8" fill="#708090" stroke="#1a0f08" stroke-width="0.4"/>
  <!-- Stacks of steel ingots (right) -->
  <rect x="88" y="100" width="6" height="8" fill="#708090" stroke="#1a0f08" stroke-width="0.4"/>
  <rect x="94" y="100" width="6" height="8" fill="#708090" stroke="#1a0f08" stroke-width="0.4"/>
  <rect x="100" y="100" width="6" height="8" fill="#708090" stroke="#1a0f08" stroke-width="0.4"/>
</svg>
