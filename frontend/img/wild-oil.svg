<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd89b"/>
      <stop offset="50%" stop-color="#f0a060"/>
      <stop offset="100%" stop-color="#c87040"/>
    </linearGradient>
    <radialGradient id="sun3" cx="80%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="100%" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="derrick" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8c30"/>
      <stop offset="100%" stop-color="#a04010"/>
    </linearGradient>
    <linearGradient id="oil3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="100%" stop-color="#0a0606"/>
    </linearGradient>
  </defs>
  <!-- Sunset sky -->
  <rect x="0" y="0" width="128" height="128" fill="url(#sky3)" rx="8"/>
  <circle cx="100" cy="28" r="20" fill="url(#sun3)"/>
  <circle cx="100" cy="28" r="8" fill="#ffe680" opacity="0.8"/>
  <!-- Distant ground -->
  <path d="M 0,95 Q 64,88 128,95 L 128,128 L 0,128 Z" fill="#5a3a20"/>
  <path d="M 0,100 Q 64,96 128,100 L 128,128 L 0,128 Z" fill="#3a2410" opacity="0.6"/>
  <!-- Oil pool (left) -->
  <ellipse cx="28" cy="108" rx="18" ry="4" fill="url(#oil3)"/>
  <ellipse cx="24" cy="106" rx="6" ry="1.2" fill="#5a3a20" opacity="0.6"/>
  <!-- Oil derrick (center) -->
  <!-- Base -->
  <rect x="46" y="100" width="36" height="6" fill="#3a2010"/>
  <rect x="46" y="100" width="36" height="2" fill="#5a3018"/>
  <!-- Derrick frame -->
  <path d="M 50,100 L 56,30 L 60,30 L 60,100 Z" fill="url(#derrick)"/>
  <path d="M 78,100 L 72,30 L 68,30 L 68,100 Z" fill="url(#derrick)"/>
  <!-- Cross beams -->
  <line x1="52" y1="50" x2="76" y2="50" stroke="#ff8c30" stroke-width="2"/>
  <line x1="53" y1="65" x2="75" y2="65" stroke="#ff8c30" stroke-width="2"/>
  <line x1="54" y1="80" x2="74" y2="80" stroke="#ff8c30" stroke-width="2"/>
  <!-- Top -->
  <line x1="56" y1="30" x2="72" y2="30" stroke="#ffaa50" stroke-width="2"/>
  <circle cx="64" cy="28" r="2" fill="#ffd700"/>
  <!-- Hanging pump -->
  <line x1="64" y1="30" x2="64" y2="42" stroke="#1a0f08" stroke-width="1.5"/>
  <rect x="61" y="42" width="6" height="8" fill="#1a0f08"/>
  <line x1="64" y1="50" x2="64" y2="60" stroke="#1a0f08" stroke-width="1.5"/>
  <rect x="61" y="60" width="6" height="6" fill="#1a0f08"/>
  <!-- Oil flow -->
  <path d="M 64,68 Q 64,85 60,100" fill="none" stroke="url(#oil3)" stroke-width="3" stroke-linecap="round"/>
  <!-- Steam/smoke -->
  <ellipse cx="50" cy="22" rx="3" ry="2" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="56" cy="18" rx="4" ry="2.5" fill="#ffffff" opacity="0.4"/>
  <ellipse cx="62" cy="14" rx="5" ry="3" fill="#ffffff" opacity="0.3"/>
  <!-- Small oil pumpjack (right) -->
  <rect x="90" y="98" width="22" height="4" fill="#3a2010"/>
  <line x1="92" y1="98" x2="100" y2="80" stroke="#1a0f08" stroke-width="2"/>
  <line x1="110" y1="98" x2="100" y2="80" stroke="#1a0f08" stroke-width="2"/>
  <rect x="95" y="78" width="10" height="6" fill="#ff8c30"/>
  <line x1="100" y1="84" x2="100" y2="98" stroke="#1a0f08" stroke-width="2"/>
  <ellipse cx="102" cy="105" rx="6" ry="1.5" fill="url(#oil3)"/>
</svg>
