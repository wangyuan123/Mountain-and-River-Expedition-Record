<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Rock Matrix Gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Purple Rare Crystal Main -->
    <linearGradient id="crystMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <!-- Cyan Secondary Crystal -->
    <linearGradient id="crystCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Base Ore Rock Matrix -->
  <polygon points="5,22 8,16 16,14 24,17 28,23 23,28 9,28" fill="url(#rockGrad)" stroke="#0f172a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Rock cracks & texture -->
  <line x1="8" y1="21" x2="13" y2="24" stroke="#1e293b" stroke-width="0.7"/>
  <line x1="20" y1="22" x2="25" y2="25" stroke="#1e293b" stroke-width="0.7"/>

  <!-- Left Smaller Cyan Crystal -->
  <polygon points="9,18 7,10 11,8 14,14 11,19" fill="url(#crystCyan)" stroke="#0c4a6e" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- Left crystal facet line -->
  <line x1="7" y1="10" x2="11" y2="19" stroke="#bae6fd" stroke-width="0.6"/>

  <!-- Right Medium Violet Crystal -->
  <polygon points="19,16 23,7 26,11 23,21 18,19" fill="url(#crystMain)" stroke="#3b0764" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- Right crystal facet line -->
  <line x1="23" y1="7" x2="23" y2="21" stroke="#f3e8ff" stroke-width="0.6"/>

  <!-- Center Tall Crystal Prism (Hero Crystal) -->
  <polygon points="12,16 16,3 20,6 20,20 15,22" fill="url(#crystMain)" stroke="#3b0764" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Center facet highlight -->
  <polygon points="12,16 16,3 17,8 14,19" fill="#ffffff" opacity="0.45"/>
  <line x1="16" y1="3" x2="17.5" y2="21" stroke="#fdf4ff" stroke-width="0.8"/>

  <!-- Front Small Crystal Shard -->
  <polygon points="14,24 17,17 20,18 18,25" fill="url(#crystCyan)" stroke="#0c4a6e" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Shimmering Sparkles -->
  <path d="M16 3 L16.8 4.2 L18 5 L16.8 5.8 L16 7 L15.2 5.8 L14 5 L15.2 4.2 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="23" cy="7" r="0.8" fill="#ffffff" opacity="0.8"/>
</svg>
