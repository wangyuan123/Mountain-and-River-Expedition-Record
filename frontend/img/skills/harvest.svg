<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skl_harv_wheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="skl_harv_sickle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="skl_harv_ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="skl_harv_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
    <filter id="skl_harv_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#skl_harv_shadow)">
    <!-- Golden Harvest Glow -->
    <circle cx="32" cy="32" r="28" fill="url(#skl_harv_glow)"/>

    <!-- Left Sheaf Grains -->
    <g transform="rotate(-18 32 45)">
      <line x1="32" y1="48" x2="32" y2="10" stroke="#b45309" stroke-width="2.5"/>
      <!-- Grains -->
      <ellipse cx="27" cy="14" rx="4" ry="2.2" fill="url(#skl_harv_wheat)" transform="rotate(-35 27 14)"/>
      <ellipse cx="37" cy="14" rx="4" ry="2.2" fill="url(#skl_harv_wheat)" transform="rotate(35 37 14)"/>
      <ellipse cx="26" cy="20" rx="4.5" ry="2.5" fill="url(#skl_harv_wheat)" transform="rotate(-35 26 20)"/>
      <ellipse cx="38" cy="20" rx="4.5" ry="2.5" fill="url(#skl_harv_wheat)" transform="rotate(35 38 20)"/>
      <ellipse cx="25" cy="27" rx="5" ry="2.8" fill="url(#skl_harv_wheat)" transform="rotate(-35 25 27)"/>
      <ellipse cx="39" cy="27" rx="5" ry="2.8" fill="url(#skl_harv_wheat)" transform="rotate(35 39 27)"/>
      <ellipse cx="32" cy="9" rx="3" ry="5" fill="#fef08a"/>
    </g>

    <!-- Right Sheaf Grains -->
    <g transform="rotate(18 32 45)">
      <line x1="32" y1="48" x2="32" y2="10" stroke="#b45309" stroke-width="2.5"/>
      <!-- Grains -->
      <ellipse cx="27" cy="14" rx="4" ry="2.2" fill="url(#skl_harv_wheat)" transform="rotate(-35 27 14)"/>
      <ellipse cx="37" cy="14" rx="4" ry="2.2" fill="url(#skl_harv_wheat)" transform="rotate(35 37 14)"/>
      <ellipse cx="26" cy="20" rx="4.5" ry="2.5" fill="url(#skl_harv_wheat)" transform="rotate(-35 26 20)"/>
      <ellipse cx="38" cy="20" rx="4.5" ry="2.5" fill="url(#skl_harv_wheat)" transform="rotate(35 38 20)"/>
      <ellipse cx="25" cy="27" rx="5" ry="2.8" fill="url(#skl_harv_wheat)" transform="rotate(-35 25 27)"/>
      <ellipse cx="39" cy="27" rx="5" ry="2.8" fill="url(#skl_harv_wheat)" transform="rotate(35 39 27)"/>
      <ellipse cx="32" cy="9" rx="3" ry="5" fill="#fef08a"/>
    </g>

    <!-- Harvest Crescent Sickle (Curving across) -->
    <path d="M48 20 C54 32, 46 44, 34 46 C24 48, 16 42, 14 36 C16 40, 24 44, 34 41 C42 38, 48 30, 43 21 Z"
          fill="url(#skl_harv_sickle)" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Sickle Handle -->
    <rect x="12" y="44" width="5" height="12" rx="2" fill="#78350f" transform="rotate(-30 14 50)"/>
    <circle cx="11" cy="53" r="2.5" fill="#d97706"/>

    <!-- Red Military Sheaf Ribbon -->
    <rect x="25" y="44" width="14" height="6" rx="2" fill="url(#skl_harv_ribbon)"/>
    <polygon points="32,49 26,58 32,55 38,58" fill="url(#skl_harv_ribbon)"/>
    <circle cx="32" cy="47" r="2" fill="#fef08a"/>
  </g>
</svg>
