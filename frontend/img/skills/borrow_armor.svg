<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skl_barm_helmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skl_barm_hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="skl_barm_visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="skl_barm_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="skl_barm_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#skl_barm_shadow)">
    <!-- Hexagonal Deflection Barrier Glow -->
    <circle cx="32" cy="32" r="28" fill="url(#skl_barm_glow)"/>

    <!-- Kinetic Hexagonal Energy Shield Matrix (Background Aura) -->
    <!-- Center Top Hexagon -->
    <polygon points="32,6 40,11 40,20 32,25 24,20 24,11" fill="none" stroke="url(#skl_barm_hex)" stroke-width="1.5" opacity="0.9"/>
    <!-- Left Hexagon -->
    <polygon points="18,14 26,19 26,28 18,33 10,28 10,19" fill="none" stroke="url(#skl_barm_hex)" stroke-width="1.2" opacity="0.7"/>
    <!-- Right Hexagon -->
    <polygon points="46,14 54,19 54,28 46,33 38,28 38,19" fill="none" stroke="url(#skl_barm_hex)" stroke-width="1.2" opacity="0.7"/>
    <!-- Bottom Left Hexagon -->
    <polygon points="14,31 22,36 22,45 14,50 6,45 6,36" fill="none" stroke="url(#skl_barm_hex)" stroke-width="1.2" opacity="0.6"/>
    <!-- Bottom Right Hexagon -->
    <polygon points="50,31 58,36 58,45 50,50 42,45 42,36" fill="none" stroke="url(#skl_barm_hex)" stroke-width="1.2" opacity="0.6"/>

    <!-- Sloped Heavy Military Combat Helmet (Foreground) -->
    <!-- Helmet Dome Shell -->
    <path d="M12 36 C12 18, 52 18, 52 36 C52 44, 46 47, 43 47 L43 42 C40 43, 24 43, 21 42 L21 47 C18 47, 12 44, 12 36 Z"
          fill="url(#skl_barm_helmet)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Helmet Top Ridge Crest -->
    <path d="M30 18 C30 14, 34 14, 34 18 L33 36 L31 36 Z" fill="#cbd5e1"/>

    <!-- Tactical NVG / Visor Mount Plate -->
    <polygon points="26,24 38,24 36,30 28,30" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
    <!-- Visor Slit (Cyan Glow) -->
    <rect x="23" y="32" width="18" height="3" rx="1.5" fill="url(#skl_barm_visor)"/>

    <!-- Helmet Rim / Flange -->
    <path d="M10 38 C14 41, 50 41, 54 38 L52 42 C46 45, 18 45, 12 42 Z"
          fill="#475569" stroke="#64748b" stroke-width="0.8"/>

    <!-- Titanium Deflection Rivets -->
    <circle cx="16" cy="38" r="1.5" fill="#f8fafc"/>
    <circle cx="48" cy="38" r="1.5" fill="#f8fafc"/>
    <circle cx="32" cy="22" r="1.5" fill="#5eead4"/>

    <!-- Kinetic Spark Barrier Deflection Sparkles -->
    <polygon points="48,10 50,13 53,14 50,15 48,18 46,15 43,14 46,13" fill="#5eead4"/>
    <polygon points="12,18 13.5,20.5 16,21 13.5,21.5 12,24 10.5,21.5 8,21 10.5,20.5" fill="#ffffff"/>
  </g>
</svg>
