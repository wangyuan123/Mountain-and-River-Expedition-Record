<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skl_res_violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="skl_res_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="skl_res_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <filter id="skl_res_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#skl_res_shadow)">
    <!-- Quantum Violet Aura -->
    <circle cx="32" cy="32" r="28" fill="url(#skl_res_glow)"/>

    <!-- Three Atomic Orbital Ellipses -->
    <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#skl_res_violet)" stroke-width="1.8"
             transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#skl_res_violet)" stroke-width="1.8"
             transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="url(#skl_res_violet)" stroke-width="1.8"
             transform="rotate(-60 32 32)"/>

    <!-- Orbital Quantum Electrons -->
    <circle cx="56" cy="32" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="20" cy="11" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8"/>
    <circle cx="20" cy="53" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Optical Lens & Prism Core -->
    <polygon points="32,14 46,38 18,38" fill="url(#skl_res_cyan)" opacity="0.8" stroke="#ffffff" stroke-width="0.8"/>
    <polygon points="32,50 18,26 46,26" fill="url(#skl_res_violet)" opacity="0.6" stroke="#c084fc" stroke-width="0.8"/>

    <!-- Core Quantum Nucleus / Glowing Sun -->
    <circle cx="32" cy="32" r="7" fill="url(#skl_res_cyan)"/>
    <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>

    <!-- Sparkle Energy Rays -->
    <line x1="32" y1="21" x2="32" y2="25" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="39" x2="32" y2="43" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="21" y1="32" x2="25" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="39" y1="32" x2="43" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
