<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skl_frenzy_flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="skl_frenzy_blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="skl_frenzy_blade2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="skl_frenzy_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="skl_frenzy_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="skl_frenzy_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#skl_frenzy_shadow)">
    <!-- Ambient War Glow -->
    <circle cx="32" cy="32" r="28" fill="url(#skl_frenzy_glow)"/>

    <!-- Background Battle Flames -->
    <path d="M32 4 C35 14, 44 18, 41 28 C46 22, 49 26, 47 34 C52 30, 56 36, 52 46 C48 54, 38 58, 32 58 C26 58, 16 54, 12 46 C8 36, 12 30, 17 34 C15 26, 18 22, 23 28 C20 18, 29 14, 32 4 Z"
          fill="url(#skl_frenzy_flame)" opacity="0.85"/>

    <!-- Left Sword (Pointing top-right) -->
    <g transform="rotate(45 32 32)">
      <!-- Blade -->
      <polygon points="32,7 35,16 35,43 32,47 29,43 29,16" fill="url(#skl_frenzy_blade1)"/>
      <polygon points="32,7 35,16 32,47" fill="#ffffff" opacity="0.5"/>
      <line x1="32" y1="9" x2="32" y2="45" stroke="#cbd5e1" stroke-width="0.8"/>
      <!-- Crossguard -->
      <path d="M23 44 C27 43, 37 43, 41 44 L40 47 C36 46, 28 46, 24 47 Z" fill="url(#skl_frenzy_gold)"/>
      <!-- Grip -->
      <rect x="30" y="47" width="4" height="8" rx="1" fill="#78350f"/>
      <line x1="30" y1="49" x2="34" y2="49" stroke="#fbbf24" stroke-width="0.6"/>
      <line x1="30" y1="52" x2="34" y2="52" stroke="#fbbf24" stroke-width="0.6"/>
      <!-- Pommel -->
      <circle cx="32" cy="56" r="2.5" fill="url(#skl_frenzy_gold)"/>
    </g>

    <!-- Right Sword (Pointing top-left) -->
    <g transform="rotate(-45 32 32)">
      <!-- Blade -->
      <polygon points="32,7 35,16 35,43 32,47 29,43 29,16" fill="url(#skl_frenzy_blade2)"/>
      <polygon points="32,7 29,16 32,47" fill="#ffffff" opacity="0.4"/>
      <line x1="32" y1="9" x2="32" y2="45" stroke="#94a3b8" stroke-width="0.8"/>
      <!-- Crossguard -->
      <path d="M23 44 C27 43, 37 43, 41 44 L40 47 C36 46, 28 46, 24 47 Z" fill="url(#skl_frenzy_gold)"/>
      <!-- Grip -->
      <rect x="30" y="47" width="4" height="8" rx="1" fill="#78350f"/>
      <line x1="30" y1="49" x2="34" y2="49" stroke="#fbbf24" stroke-width="0.6"/>
      <line x1="30" y1="52" x2="34" y2="52" stroke="#fbbf24" stroke-width="0.6"/>
      <!-- Pommel -->
      <circle cx="32" cy="56" r="2.5" fill="url(#skl_frenzy_gold)"/>
    </g>

    <!-- Center Clash Spark -->
    <polygon points="32,26 34,31 39,32 34,33 32,38 30,33 25,32 30,31" fill="#ffffff"/>
    <circle cx="32" cy="32" r="3" fill="#fef08a" opacity="0.9"/>
  </g>
</svg>
