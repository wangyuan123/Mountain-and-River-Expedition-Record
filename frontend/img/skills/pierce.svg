<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skl_pierce_dart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a5f3fc"/>
      <stop offset="70%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="skl_pierce_plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="skl_pierce_glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="skl_pierce_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#skl_pierce_shadow)">
    <!-- Kinetic Impact Glow -->
    <circle cx="34" cy="30" r="26" fill="url(#skl_pierce_glow)"/>

    <!-- Sloped Heavy Armor Plate (Cracked & Fractured) -->
    <!-- Top-right broken piece -->
    <polygon points="26,12 52,16 46,38 34,26" fill="url(#skl_pierce_plate)" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Bottom-left broken piece -->
    <polygon points="18,24 28,34 22,52 10,42" fill="url(#skl_pierce_plate)" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Shattered Shards Flying -->
    <polygon points="40,22 45,20 42,26" fill="#cbd5e1"/>
    <polygon points="22,38 25,43 20,42" fill="#94a3b8"/>
    <polygon points="36,40 42,44 38,46" fill="#e2e8f0"/>

    <!-- High-Velocity Kinetic Penetrator (Dart from top-left to bottom-right) -->
    <g transform="rotate(45 32 32)">
      <!-- Sabot Fin -->
      <polygon points="32,8 36,20 32,24 28,20" fill="#38bdf8"/>
      <polygon points="32,20 35,48 32,58 29,48" fill="url(#skl_pierce_dart)"/>
      <polygon points="32,22 34,50 32,58" fill="#ffffff" opacity="0.9"/>
      <!-- Fins -->
      <polygon points="28,24 23,26 29,29" fill="#0891b2"/>
      <polygon points="36,24 41,26 35,29" fill="#0891b2"/>
    </g>

    <!-- Kinetic Pierce Shockwave Rings -->
    <ellipse cx="33" cy="31" rx="12" ry="5" fill="none" stroke="#67e8f9" stroke-width="1.8" transform="rotate(-45 33 31)"/>
    <ellipse cx="36" cy="34" rx="18" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" transform="rotate(-45 36 34)"/>

    <!-- White-hot Penetration Core -->
    <circle cx="33" cy="31" r="3.5" fill="#ffffff"/>
  </g>
</svg>
