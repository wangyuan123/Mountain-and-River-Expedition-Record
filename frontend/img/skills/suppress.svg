<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skl_suppress_blast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="skl_suppress_reticle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="skl_suppress_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
    <filter id="skl_suppress_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#skl_suppress_shadow)">
    <!-- Blast Core Glow -->
    <circle cx="32" cy="32" r="26" fill="url(#skl_suppress_glow)"/>

    <!-- Artillery Muzzle Flash Burst Star -->
    <path d="M32 8 L35 24 L48 15 L40 28 L56 32 L40 36 L48 49 L35 40 L32 56 L29 40 L16 49 L24 36 L8 32 L24 28 L16 15 L29 24 Z"
          fill="url(#skl_suppress_blast)" opacity="0.65"/>

    <!-- Tactical Radar / Target Rings -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="url(#skl_suppress_reticle)" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="14" fill="none" stroke="url(#skl_suppress_reticle)" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="32" cy="32" r="5" fill="#fef08a" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Crosshair Reticle Lines with Tick Marks -->
    <line x1="32" y1="5" x2="32" y2="23" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="41" x2="32" y2="59" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5" y1="32" x2="23" y2="32" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="41" y1="32" x2="59" y2="32" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Suppression Chevrons (Heavy down-force) -->
    <polygon points="32,25 36,29 34,29 34,36 30,36 30,29 28,29" fill="#dc2626"/>
    <!-- Corner Reticle Brackets -->
    <path d="M18 22 H14 V26" stroke="#fef08a" stroke-width="2" fill="none"/>
    <path d="M46 22 H50 V26" stroke="#fef08a" stroke-width="2" fill="none"/>
    <path d="M18 42 H14 V38" stroke="#fef08a" stroke-width="2" fill="none"/>
    <path d="M46 42 H50 V38" stroke="#fef08a" stroke-width="2" fill="none"/>
  </g>
</svg>
