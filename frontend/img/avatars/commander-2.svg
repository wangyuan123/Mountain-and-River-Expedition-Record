<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="c2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="c2skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="c2suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="c2goggle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#c2bg)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Jacket -->
  <path d="M22 92 C22 74 32 66 50 66 C68 66 78 74 78 92 Z" fill="url(#c2suit)"/>
  <!-- Tanker Skull / Cross Badge -->
  <polygon points="46,67 54,67 50,77" fill="#dc2626"/>
  <!-- Head & Ears -->
  <circle cx="34" cy="48" r="4" fill="#ea580c"/>
  <circle cx="66" cy="48" r="4" fill="#ea580c"/>
  <path d="M36 42 C36 28 64 28 64 42 C64 56 58 64 50 64 C42 64 36 56 36 42 Z" fill="url(#c2skin)"/>
  <!-- Eyes -->
  <circle cx="44" cy="44" r="2.2" fill="#0f172a"/>
  <circle cx="56" cy="44" r="2.2" fill="#0f172a"/>
  <!-- Stern Eyebrows -->
  <path d="M40 40 L48 42" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <path d="M60 40 L52 42" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth -->
  <line x1="46" y1="54" x2="54" y2="54" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  <!-- Black Beret tilted to right -->
  <path d="M26 34 C24 16 66 14 74 24 C82 32 76 40 68 38 C58 35 34 36 26 34 Z" fill="#0f172a"/>
  <circle cx="38" cy="28" r="3" fill="#e2e8f0"/>
  <!-- Tactical Goggles on forehead -->
  <rect x="30" y="24" width="40" height="4" rx="2" fill="#475569"/>
  <rect x="36" y="21" width="12" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <rect x="38" y="23" width="8" height="6" rx="2" fill="url(#c2goggle)"/>
  <rect x="52" y="21" width="12" height="10" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <rect x="54" y="23" width="8" height="6" rx="2" fill="url(#c2goggle)"/>
  <!-- Tanker Headphones / Throat Mic -->
  <path d="M32 46 C32 40 33 52 32 54" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 46 C68 40 67 52 68 54" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
</svg>
