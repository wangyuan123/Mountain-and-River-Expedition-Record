<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="c7bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="c7skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba16c"/>
    </linearGradient>
    <linearGradient id="c7gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#c7bg)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Grand Marshal Uniform -->
  <path d="M22 92 C22 75 32 68 50 68 C68 68 78 75 78 92 Z" fill="#1e293b"/>
  <!-- Gold Marshal Sash -->
  <path d="M26 82 L70 92 L75 88 L34 76 Z" fill="url(#c7gold)"/>
  <!-- Red Collar Tabs with Gold Stars -->
  <polygon points="36,68 44,78 40,78 34,68" fill="#dc2626"/>
  <circle cx="39" cy="74" r="1.5" fill="url(#c7gold)"/>
  <polygon points="64,68 56,78 60,78 66,68" fill="#dc2626"/>
  <circle cx="61" cy="74" r="1.5" fill="url(#c7gold)"/>
  <!-- Head & Chin -->
  <path d="M36 42 C36 28 64 28 64 42 C64 56 58 64 50 64 C42 64 36 56 36 42 Z" fill="url(#c7skin)"/>
  <!-- Mustache / Dignified General -->
  <circle cx="44" cy="42" r="2" fill="#0f172a"/>
  <circle cx="56" cy="42" r="2" fill="#0f172a"/>
  <path d="M43 51 Q47 49 50 51 Q53 49 57 51 Q50 55 43 51 Z" fill="#475569"/>
  <!-- Marshal Peaked Cap -->
  <path d="M28 30 C28 14 72 14 72 30 Z" fill="#334155"/>
  <rect x="28" y="27" width="44" height="6" fill="#7f1d1d"/>
  <!-- Gold Oak Leaves Embroidery on Cap Band -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="url(#c7gold)" stroke-width="2.5" stroke-dasharray="3,2"/>
  <!-- Big Gold Marshal Star -->
  <polygon points="50,19 51.5,23 55.5,23 52.5,25.5 53.5,29.5 50,27 46.5,29.5 47.5,25.5 44.5,23 48.5,23" fill="url(#c7gold)"/>
  <!-- Visor -->
  <path d="M26 33 C30 39 70 39 74 33 C74 35 71 40 50 41 C29 40 26 35 26 33 Z" fill="#090d16"/>
  <path d="M30 36 Q50 40 70 36" stroke="url(#c7gold)" stroke-width="1.8" fill="none"/>
</svg>
