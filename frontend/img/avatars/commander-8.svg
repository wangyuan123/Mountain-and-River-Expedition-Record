  <circle cx="47" cy="38" r="1.6" fill="#1e293b"/>
  <path d="M53 37 Q55 35 56 38" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M48 44 Q52 48 56 44" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Little Blush -->
  <ellipse cx="44" cy="43" rx="2.5" ry="1.2" fill="#fca5a5"/>
  <ellipse cx="58" cy="43" rx="2.5" ry="1.2" fill="#fca5a5"/>
  <!-- Stickman Body & Little Arms on Desk -->
  <line x1="50" y1="54" x2="50" y2="68" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Arm holding cup / resting on table -->
  <path d="M50 58 Q44 60 42 66" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 58 Q58 60 62 66" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
