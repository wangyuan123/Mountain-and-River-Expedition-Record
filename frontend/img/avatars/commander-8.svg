  <path d="M72 82 L82 82 L82 72" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Doodle Desk -->
  <rect x="24" y="66" width="52" height="5" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <line x1="32" y1="71" x2="32" y2="82" stroke="#475569" stroke-width="2"/>
  <line x1="68" y1="71" x2="68" y2="82" stroke="#475569" stroke-width="2"/>
  <!-- Tea / Coffee Cup with Steam -->
  <rect x="36" y="58" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
