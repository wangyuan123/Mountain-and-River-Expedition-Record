<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="c3bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="c3skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="20%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba16c"/>
    </linearGradient>
    <linearGradient id="c3leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="c3glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#c3bg)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Brown Leather Flight Jacket -->
  <path d="M22 92 C22 75 32 68 50 68 C68 68 78 75 78 92 Z" fill="url(#c3leather)"/>
  <!-- White Aviator Silk Scarf -->
  <path d="M40 68 C40 76 60 76 60 68 C64 74 68 84 66 92 L54 92 C56 84 52 74 40 68 Z" fill="#f8fafc"/>
  <!-- Head & Chin -->
  <path d="M36 44 C36 30 64 30 64 44 C64 58 58 64 50 64 C42 64 36 58 36 44 Z" fill="url(#c3skin)"/>
  <!-- Leather Flight Helmet & Ear Flaps -->
  <path d="M30 38 C30 18 70 18 70 38 L70 54 C70 57 66 58 65 52 L65 44 L35 44 L35 52 C34 58 30 57 30 54 Z" fill="url(#c3leather)"/>
  <path d="M35 56 L44 63 L56 63 L65 56" stroke="#451a03" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="44" cy="46" r="2" fill="#0f172a"/>
  <circle cx="56" cy="46" r="2" fill="#0f172a"/>
  <!-- Confident Smile -->
  <path d="M45 55 Q50 59 55 55" stroke="#9a3412" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Aviator Goggles on Cap -->
  <rect x="30" y="28" width="40" height="4" rx="2" fill="#1e293b"/>
  <!-- Left Goggle Lens -->
  <ellipse cx="42" cy="30" rx="7" ry="6" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <ellipse cx="42" cy="30" rx="5.5" ry="4.5" fill="url(#c3glass)"/>
  <!-- Right Goggle Lens -->
  <ellipse cx="58" cy="30" rx="7" ry="6" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <ellipse cx="58" cy="30" rx="5.5" ry="4.5" fill="url(#c3glass)"/>
  <!-- Goggle Bridge -->
  <rect x="48" y="29" width="4" height="2" fill="#e2e8f0"/>
</svg>
