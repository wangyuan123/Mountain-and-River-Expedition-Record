<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rfSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a1a5a"/>
      <stop offset="100%" stop-color="#7a3aaa"/>
    </linearGradient>
    <linearGradient id="rfBld" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3a6a"/>
      <stop offset="100%" stop-color="#2a1a3a"/>
    </linearGradient>
    <radialGradient id="rfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rfCrystal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" fill="url(#rfSky)" rx="8"/>
  <!-- Background glow -->
  <circle cx="64" cy="50" r="40" fill="url(#rfGlow)"/>
  <!-- Stars -->
  <circle cx="20" cy="20" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="108" cy="18" r="1.2" fill="#fff" opacity="0.9"/>
  <circle cx="40" cy="14" r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="90" cy="32" r="0.8" fill="#fff" opacity="0.6"/>
  <!-- Main building -->
  <rect x="22" y="40" width="84" height="68" fill="url(#rfBld)" stroke="#1a0a2a" stroke-width="1"/>
  <!-- Roof (industrial slanted) -->
  <path d="M 18,40 L 64,28 L 110,40 Z" fill="#3a2a4a" stroke="#1a0a2a" stroke-width="1"/>
  <!-- Chimney with purple glow -->
  <rect x="78" y="14" width="10" height="22" fill="#2a1a3a" stroke="#1a0a2a" stroke-width="0.8"/>
  <rect x="76" y="12" width="14" height="3" fill="#1a0a2a"/>
  <!-- Purple smoke/energy -->
  <ellipse cx="83" cy="6" rx="6" ry="3" fill="#c084fc" opacity="0.7"/>
  <ellipse cx="86" cy="0" rx="5" ry="2" fill="#e9d5ff" opacity="0.5"/>
  <!-- Windows with purple glow -->
  <rect x="30" y="50" width="10" height="10" fill="#a855f7" stroke="#1a0a2a" stroke-width="0.5"/>
  <rect x="46" y="50" width="10" height="10" fill="#a855f7" stroke="#1a0a2a" stroke-width="0.5"/>
  <rect x="62" y="50" width="10" height="10" fill="#a855f7" stroke="#1a0a2a" stroke-width="0.5"/>
  <rect x="78" y="50" width="10" height="10" fill="#a855f7" stroke="#1a0a2a" stroke-width="0.5"/>
  <rect x="94" y="50" width="10" height="10" fill="#a855f7" stroke="#1a0a2a" stroke-width="0.5"/>
  <!-- Window cross frames -->
  <line x1="35" y1="50" x2="35" y2="60" stroke="#1a0a2a" stroke-width="0.5"/>
  <line x1="30" y1="55" x2="40" y2="55" stroke="#1a0a2a" stroke-width="0.5"/>
  <!-- Door (refinery entrance) -->
  <rect x="56" y="78" width="20" height="30" fill="#1a0a2a" stroke="#0a0414" stroke-width="0.8"/>
  <ellipse cx="66" cy="88" rx="7" ry="2" fill="#c084fc" opacity="0.8"/>
  <!-- Ground glow -->
  <ellipse cx="66" cy="108" rx="22" ry="3" fill="#a855f7" opacity="0.4"/>
  <!-- Crystal displays (showing rare ore) -->
  <!-- Left crystal display -->
  <path d="M 28,80 L 32,75 L 36,80 L 32,90 Z" fill="url(#rfCrystal)" stroke="#581c87" stroke-width="0.6"/>
  <path d="M 32,75 L 32,90" stroke="#f3e8ff" stroke-width="0.6" opacity="0.7"/>
  <!-- Right crystal display -->
  <path d="M 92,80 L 96,75 L 100,80 L 96,90 Z" fill="url(#rfCrystal)" stroke="#581c87" stroke-width="0.6"/>
  <path d="M 96,75 L 96,90" stroke="#f3e8ff" stroke-width="0.6" opacity="0.7"/>
  <!-- Conveyor belt with ore -->
  <rect x="30" y="98" width="68" height="4" fill="#1a0a2a"/>
  <ellipse cx="42" cy="100" rx="2" ry="1.5" fill="#c084fc"/>
  <ellipse cx="58" cy="100" rx="2" ry="1.5" fill="#a855f7"/>
  <ellipse cx="74" cy="100" rx="2" ry="1.5" fill="#c084fc"/>
  <ellipse cx="90" cy="100" rx="2" ry="1.5" fill="#a855f7"/>
  <!-- Sign/logo -->
  <circle cx="64" cy="65" r="4" fill="#e9d5ff" stroke="#581c87" stroke-width="0.6"/>
  <path d="M 64,62 L 65,64 L 64,68 L 63,64 Z" fill="#581c87"/>
</svg>
