<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emPop_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="40%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="emPop_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emPop_horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="emPop_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#emPop_shadow)">
    <!-- Base Plate Shield -->
    <path d="M14 8 L50 8 L54 16 L54 44 L32 58 L10 44 L10 16 Z"
          fill="url(#emPop_bg)" stroke="url(#emPop_gold)" stroke-width="1.2"/>
    <path d="M16 10 L48 10 L51 17 L51 42 L32 55 L13 42 L13 17 Z"
          fill="#450a0a" stroke="#dc2626" stroke-width="0.8"/>

    <!-- Warning Chevrons / Hazard Stripes at top -->
    <path d="M22 10 L25 15 M28 10 L31 15 M34 10 L37 15 M40 10 L43 15" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Emergency Mobilization Bugle / Megaphone Horn -->
    <g transform="translate(4, -1)">
      <!-- Megaphone Body -->
      <path d="M16 26 L23 26 L36 17 L38 17 L38 39 L36 39 L23 30 L16 30 Z"
            fill="url(#emPop_horn)" stroke="#78350f" stroke-width="0.8"/>
      <!-- Megaphone bell rim -->
      <ellipse cx="38" cy="28" rx="2.5" ry="11" fill="#451a03" stroke="url(#emPop_gold)" stroke-width="0.8"/>

      <!-- Megaphone handle -->
      <path d="M22 30 L22 37 L25 37 L25 30" fill="url(#emPop_horn)" stroke="#78350f" stroke-width="0.5"/>

      <!-- Sound Waves / Emergency Acoustic Rings -->
      <path d="M42 22 C45 25, 45 31, 42 34" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M46 17 C51 22, 51 34, 46 39" fill="none" stroke="#fde047" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M50 12 C57 19, 57 37, 50 44" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Emergency Speed Lightning -->
      <path d="M12 21 L16 23 L13 26 L18 28" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom Emergency Label Banner ("紧急动员") -->
    <rect x="17" y="44" width="30" height="10" rx="2.5" ry="2.5" fill="#1f0901" stroke="url(#emPop_gold)" stroke-width="1.2"/>
    <text x="32" y="49.5" text-anchor="middle" dominant-baseline="central" fill="#fef08a"
          font-family="system-ui, 'PingFang SC', sans-serif" font-weight="900" font-size="6.5" letter-spacing="0.5">紧急动员</text>
  </g>
</svg>
