<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rp500_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rp500_crate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1f0901"/>
    </linearGradient>
    <radialGradient id="rp500_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="rp500_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#rp500_shadow)">
    <!-- Golden Radiance Aura -->
    <ellipse cx="32" cy="34" rx="24" ry="20" fill="url(#rp500_glow)"/>

    <ellipse cx="32" cy="56" rx="24" ry="4" fill="#000000" opacity="0.45"/>

    <!-- Massive Heavy Strategic Container Body -->
    <rect x="9" y="24" width="46" height="28" rx="3" fill="url(#rp500_crate)" stroke="url(#rp500_gold)" stroke-width="1.2"/>

    <!-- Vault Lid -->
    <path d="M7 24 L14 14 L50 14 L57 24 Z" fill="url(#rp500_gold)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Lid Center Top Handle -->
    <rect x="25" y="10" width="14" height="4" rx="1.5" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>

    <!-- Golden Reinforced Cross-Straps -->
    <rect x="18" y="24" width="4" height="28" fill="url(#rp500_gold)"/>
    <rect x="42" y="24" width="4" height="28" fill="url(#rp500_gold)"/>
    <rect x="9" y="36" width="46" height="3" fill="url(#rp500_gold)"/>

    <!-- Center Giant 500W Strategic Seal Vault Door Wheel -->
    <circle cx="32" cy="37" r="9" fill="#1f0901" stroke="url(#rp500_gold)" stroke-width="1.2"/>
    <circle cx="32" cy="37" r="7.5" fill="none" stroke="#fde047" stroke-width="0.6" stroke-dasharray="2 1.5"/>

    <!-- Stacks of Gold Bars / Strategic Bullion in Vault Core -->
    <polygon points="32,31 36,33 32,35 28,33" fill="#ffffff"/>
    <polygon points="28,35 32,37 32,41 28,39" fill="#fbbf24"/>
    <polygon points="36,35 32,37 32,41 36,39" fill="#d97706"/>

    <!-- Bottom Huge Label ("500万") -->
    <rect x="18" y="47" width="28" height="9.5" rx="2" ry="2" fill="#450a0a" stroke="url(#rp500_gold)" stroke-width="1"/>
    <text x="32" y="52" text-anchor="middle" dominant-baseline="central" fill="#ffffff"
          font-family="system-ui, sans-serif" font-weight="900" font-size="6.5" letter-spacing="0.5">500万</text>

    <!-- Star Twinkles -->
    <polygon points="12,16 13,18 15,19 13,20 12,22 11,20 9,19 11,18" fill="#ffffff"/>
    <polygon points="51,16 52,18 54,19 52,20 51,22 50,20 48,19 50,18" fill="#ffffff"/>
  </g>
</svg>
