<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer medallion rim (Military Lustrous Gold) -->
    <linearGradient id="tpAdv_goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Inner field gradient (Brushed Obsidian & Space Deep Blue) -->
    <linearGradient id="tpAdv_plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Quantum Teleport Warp Portal Radial Glow -->
    <radialGradient id="tpAdv_portalGlow" cx="50%" cy="47%" r="48%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gold gradient -->
    <linearGradient id="tpAdv_goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="tpAdv_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#tpAdv_shadow)">
    <!-- Base Medallion Body (Command Warrant Tablet) -->
    <path d="M22 4.5 C26 3, 38 3, 42 4.5 L53 13 L56 34 L51 53.5 L32 60.5 L13 53.5 L8 34 L11 13 Z"
          fill="url(#tpAdv_goldRim)" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- Inner Beveled Slate Field -->
    <path d="M23 7 C26.5 5.8, 37.5 5.8, 41 7 L50.5 14.5 L53.2 33.5 L48.8 51 L32 57.5 L15.2 51 L10.8 33.5 L13.5 14.5 Z"
          fill="url(#tpAdv_plate)" stroke="#b45309" stroke-width="0.8"/>

    <!-- Top Hanging Loop / Commander Crown Star -->
    <circle cx="32" cy="7.5" r="2.2" fill="#78350f" stroke="#fbbf24" stroke-width="0.8"/>
    <circle cx="32" cy="7.5" r="1.1" fill="#fef08a"/>

    <!-- Quantum Warp Portal Core -->
    <circle cx="32" cy="30" r="17" fill="url(#tpAdv_portalGlow)"/>

    <!-- Quantum Teleport Orbit Rings & Coordinates Reticle -->
    <circle cx="32" cy="30" r="16.5" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="4 2" stroke-opacity="0.7"/>
    <circle cx="32" cy="30" r="12.5" fill="none" stroke="#67e8f9" stroke-width="0.6" stroke-opacity="0.5"/>
    <circle cx="32" cy="30" r="8" fill="none" stroke="#a5f3fc" stroke-width="0.5" stroke-dasharray="2 1.5" stroke-opacity="0.8"/>

    <!-- Precision Teleport Crosshair Ticks (X & Y Axis) -->
    <line x1="32" y1="12" x2="32" y2="16" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="32" y1="44" x2="32" y2="47" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="18" y2="30" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="46" y1="30" x2="50" y2="30" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 4 Diagonal Inward Quantum Chevrons (Precision Spatial Converging Jump) -->
    <path d="M21 19 L25 19 L21 23 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M43 19 L39 19 L43 23 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M21 41 L25 41 L21 37 Z" fill="#38bdf8" opacity="0.85"/>
    <path d="M43 41 L39 41 L43 37 Z" fill="#38bdf8" opacity="0.85"/>

    <!-- Central Command Warrant Character "令" (Sharp, Authoritative Golden Character) -->
    <text x="32" y="31.5"
          text-anchor="middle"
          dominant-baseline="central"
          fill="url(#tpAdv_goldText)"
          stroke="#451a03"
          stroke-width="0.75"
          paint-order="stroke fill"
          font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
          font-weight="900"
          font-size="19"
          letter-spacing="0">令</text>

    <!-- Corner Gold Rivets / Secure Screws -->
    <circle cx="12.5" cy="15" r="1.2" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="51.5" cy="15" r="1.2" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="10" cy="34" r="1.2" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="54" cy="34" r="1.2" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>

    <!-- Bottom Golden Tactical Plaque ("高级") -->
    <g transform="translate(0, 0)">
      <rect x="19" y="47.5" width="26" height="10.5" rx="2.5" ry="2.5"
            fill="#1e1b4b" stroke="#fde047" stroke-width="1.2"/>
      <rect x="20" y="48.5" width="24" height="8.5" rx="1.8" ry="1.8"
            fill="#090d16" stroke="#d97706" stroke-width="0.5"/>
      <text x="32" y="52.7"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#fef08a"
            font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-weight="900"
            font-size="7.5"
            letter-spacing="1">高级</text>
    </g>
  </g>
</svg>
