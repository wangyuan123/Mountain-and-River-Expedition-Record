<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cmRen_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cmRen_leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="cmRen_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#cmRen_shadow)">
    <!-- Supreme Gold Dossier Case -->
    <rect x="11" y="11" width="42" height="46" rx="4" fill="url(#cmRen_leather)" stroke="url(#cmRen_gold)" stroke-width="1.2"/>
    <!-- Gold inner border -->
    <rect x="14" y="14" width="36" height="40" rx="2" fill="none" stroke="url(#cmRen_gold)" stroke-width="0.75" stroke-dasharray="4 2"/>

    <!-- Gold Corner Metal Brackets -->
    <polygon points="11,11 19,11 11,19" fill="url(#cmRen_gold)"/>
    <polygon points="53,11 45,11 53,19" fill="url(#cmRen_gold)"/>
    <polygon points="11,57 19,57 11,49" fill="url(#cmRen_gold)"/>
    <polygon points="53,57 45,57 53,49" fill="url(#cmRen_gold)"/>

    <!-- Supreme Commander 5-Star Medallion -->
    <circle cx="32" cy="27" r="11" fill="#450a0a" stroke="url(#cmRen_gold)" stroke-width="1.2"/>
    <!-- Center 5-Star Eagle / Star -->
    <path d="M32 18 L34.5 24 L41 24.5 L36 29 L37.5 35.5 L32 32 L26.5 35.5 L28 29 L23 24.5 L29.5 24 Z"
          fill="url(#cmRen_gold)"/>
    <circle cx="32" cy="28" r="2" fill="#ffffff"/>

    <!-- Official Title Ribbon: "统帅" -->
    <rect x="18" y="42" width="28" height="9" rx="2" ry="2" fill="url(#cmRen_gold)" stroke="#78350f" stroke-width="0.5"/>
    <text x="32" y="46.8" text-anchor="middle" dominant-baseline="central" fill="#451a03"
          font-family="system-ui, sans-serif" font-weight="900" font-size="6.5" letter-spacing="1">统帅调令</text>
  </g>
</svg>
