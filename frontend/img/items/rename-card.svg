<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Tactical dossier folder gradient -->
    <linearGradient id="rnCard_folder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rnCard_paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="rnCard_dogtag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="rnCard_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#rnCard_shadow)">
    <!-- Back Folder Flap -->
    <path d="M12 14 L24 14 L27 18 L52 18 C53.5 18, 54.5 19, 54.5 20.5 L54.5 54 C54.5 55.5, 53.5 56.5, 52 56.5 L12 56.5 C10.5 56.5, 9.5 55.5, 9.5 54 L9.5 16.5 C9.5 15, 10.5 14, 12 14 Z"
          fill="url(#rnCard_folder)" stroke="#64748b" stroke-width="0.8"/>

    <!-- Personnel Document Paper inside folder -->
    <rect x="14" y="11" width="36" height="42" rx="2" fill="url(#rnCard_paper)" stroke="#cbd5e1" stroke-width="0.75"/>

    <!-- Officer Profile Photo Box -->
    <rect x="17" y="15" width="13" height="15" rx="1.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
    <!-- Head silhouette -->
    <circle cx="23.5" cy="20.5" r="3" fill="#64748b"/>
    <!-- Shoulders silhouette -->
    <path d="M18.5 28.5 C18.5 25, 20.5 24, 23.5 24 C26.5 24, 28.5 25, 28.5 28.5 Z" fill="#64748b"/>

    <!-- Data lines next to photo -->
    <rect x="33" y="16" width="14" height="2" rx="1" fill="#3b82f6"/>
    <rect x="33" y="20" width="12" height="1.8" rx="0.9" fill="#94a3b8"/>
    <rect x="33" y="24" width="14" height="1.8" rx="0.9" fill="#94a3b8"/>
    <rect x="33" y="28" width="8" height="1.8" rx="0.9" fill="#94a3b8"/>

    <!-- Text rows below -->
    <line x1="17" y1="34" x2="47" y2="34" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="17" y1="38" x2="43" y2="38" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="17" y1="42" x2="47" y2="42" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="17" y1="46" x2="35" y2="46" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Red Official Approval Stamp (APPROVED / 改) -->
    <g transform="translate(36, 38) rotate(-15)">
      <rect x="-8" y="-5" width="16" height="10" rx="1.5" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.85"/>
      <text x="0" y="0.5" text-anchor="middle" dominant-baseline="central" fill="#dc2626"
            font-family="system-ui, sans-serif" font-weight="900" font-size="5.5" letter-spacing="0.5">调令</text>
    </g>

    <!-- Military Dog Tag hanging on chain -->
    <!-- Ball chain -->
    <path d="M42 9 C46 7, 52 10, 52 16 L52 26" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="1.5 1.5"/>
    <!-- Dog tag -->
    <g transform="translate(48, 25) rotate(12)">
      <rect x="-6" y="-10" width="12" height="20" rx="5" fill="url(#rnCard_dogtag)" stroke="#475569" stroke-width="0.7"/>
      <circle cx="0" cy="-6" r="1.2" fill="#334155"/>
      <!-- ID Text on Dog tag -->
      <text x="0" y="1" text-anchor="middle" dominant-baseline="central" fill="#1e293b"
            font-family="system-ui, sans-serif" font-weight="900" font-size="4.5">ID</text>
      <line x1="-3" y1="5" x2="3" y2="5" stroke="#475569" stroke-width="0.6"/>
    </g>

    <!-- Bottom Pen / Stylus -->
    <path d="M12 51 L46 51" stroke="#0f172a" stroke-width="0.8"/>
  </g>
</svg>
