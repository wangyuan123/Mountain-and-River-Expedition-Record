<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="resBox_body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="resBox_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="resBox_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#resBox_shadow)">
    <!-- Base Shadow -->
    <ellipse cx="32" cy="55" rx="23" ry="4" fill="#000000" opacity="0.4"/>

    <!-- Main Armored Box Crate -->
    <rect x="11" y="24" width="42" height="28" rx="2" fill="url(#resBox_body)" stroke="#64748b" stroke-width="0.8"/>

    <!-- Lid Rim -->
    <rect x="9" y="16" width="46" height="9" rx="2" fill="url(#resBox_metal)" stroke="#334155" stroke-width="0.8"/>
    <!-- Lid Top Bevel -->
    <path d="M12 16 L18 11 L46 11 L52 16 Z" fill="#64748b" stroke="#334155" stroke-width="0.7"/>

    <!-- Metal Straps & Corner Brackets -->
    <rect x="18" y="25" width="4" height="27" fill="url(#resBox_metal)"/>
    <rect x="42" y="25" width="4" height="27" fill="url(#resBox_metal)"/>

    <!-- Center 4-Resource Tactical Matrix Icon on Crate Face -->
    <rect x="25" y="29" width="14" height="14" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- 4 Resource Quadrants -->
    <!-- Top-Left: Food / Grain (Amber/Gold) -->
    <rect x="26.5" y="30.5" width="5" height="5" rx="1" fill="#eab308"/>
    <!-- Top-Right: Steel (Silver/Blue) -->
    <rect x="32.5" y="30.5" width="5" height="5" rx="1" fill="#94a3b8"/>
    <!-- Bottom-Left: Oil (Dark Brown/Amber) -->
    <rect x="26.5" y="36.5" width="5" height="5" rx="1" fill="#b45309"/>
    <!-- Bottom-Right: Rare (Cyan Gem) -->
    <rect x="32.5" y="36.5" width="5" height="5" rx="1" fill="#06b6d4"/>

    <!-- Handle on Front / Lock Latch -->
    <rect x="29" y="23" width="6" height="4" rx="1" fill="#e2e8f0" stroke="#334155" stroke-width="0.5"/>
    <circle cx="32" cy="25" r="0.8" fill="#1e293b"/>

    <!-- Rivets -->
    <circle cx="13" cy="27" r="1" fill="#cbd5e1"/>
    <circle cx="51" cy="27" r="1" fill="#cbd5e1"/>
    <circle cx="13" cy="49" r="1" fill="#cbd5e1"/>
    <circle cx="51" cy="49" r="1" fill="#cbd5e1"/>

    <!-- Stenciled Supply Markings -->
    <line x1="24" y1="47" x2="40" y2="47" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 1"/>
  </g>
</svg>
