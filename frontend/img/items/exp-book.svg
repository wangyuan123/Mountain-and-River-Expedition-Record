<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="expBk_cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="expBk_spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="expBk_corner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="expBk_pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="expBk_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#expBk_shadow)">
    <!-- Book pages background (side edge) -->
    <path d="M49 14 L55 17 L55 52 L49 49 Z" fill="url(#expBk_pages)" stroke="#94a3b8" stroke-width="0.5"/>
    <!-- Page lines -->
    <line x1="50" y1="23" x2="54" y2="25" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="50" y1="31" x2="54" y2="33" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="50" y1="39" x2="54" y2="41" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="50" y1="46" x2="54" y2="48" stroke="#94a3b8" stroke-width="0.5"/>

    <!-- Bottom pages edge -->
    <path d="M19 53 L51 51 L55 52 L22 55 Z" fill="#cbd5e1"/>

    <!-- Book Back Cover Rim -->
    <path d="M18 10 L51 8 L52 50 L18 53 Z" fill="#082f49"/>

    <!-- Bookmark ribbon -->
    <path d="M36 8 L40 8 L40 57 L38 54 L36 57 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="0.5"/>

    <!-- Main Front Cover -->
    <path d="M15 11 L48 8 C49.5 8, 51 9, 51 10.5 L51 49 C51 50.5, 49.5 51.5, 48 51.5 L15 54 Z"
          fill="url(#expBk_cover)" stroke="#38bdf8" stroke-width="0.75"/>

    <!-- Tactical spine band -->
    <path d="M12 11.5 C12 10, 13.5 9.5, 16 9.5 L18 9.5 L18 54 L16 54 C13.5 54, 12 53.5, 12 52 Z"
          fill="url(#expBk_spine)" stroke="#0284c7" stroke-width="0.75"/>
    <!-- Spine ridges -->
    <line x1="12" y1="18" x2="18" y2="18" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.8"/>
    <line x1="12" y1="31" x2="18" y2="31" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.8"/>
    <line x1="12" y1="44" x2="18" y2="44" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.8"/>

    <!-- Silver Corner Protectors -->
    <polygon points="43,8.5 50.5,8 50.5,15.5" fill="url(#expBk_corner)"/>
    <polygon points="43,51.5 50.5,49.5 50.5,42" fill="url(#expBk_corner)"/>

    <!-- Decorative Cover Border -->
    <path d="M21 14 L46 12 L46 47 L21 49 Z" fill="none" stroke="#7dd3fc" stroke-width="0.6" stroke-opacity="0.6"/>

    <!-- Central Military Star Emblem -->
    <circle cx="34" cy="27" r="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <path d="M34 19 L36.5 24.5 L42.5 25 L38 29 L39.5 35 L34 32 L28.5 35 L30 29 L25.5 25 L31.5 24.5 Z"
          fill="#ffffff" stroke="#7dd3fc" stroke-width="0.5"/>

    <!-- Cover Title Plate: EXP -->
    <rect x="25" y="39" width="18" height="7.5" rx="2" ry="2" fill="#082f49" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="34" y="43" text-anchor="middle" dominant-baseline="central" fill="#e0f2fe"
          font-family="system-ui, sans-serif" font-weight="900" font-size="6.5" letter-spacing="0.5">EXP</text>
  </g>
</svg>
