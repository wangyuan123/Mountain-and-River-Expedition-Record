<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="uniBk_cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="30%" stop-color="#6b21a8"/>
      <stop offset="70%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0538"/>
    </linearGradient>
    <linearGradient id="uniBk_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="uniBk_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#uniBk_shadow)">
    <!-- Page edges -->
    <path d="M49 14 L55 17 L55 52 L49 49 Z" fill="#f3e8ff" stroke="#c084fc" stroke-width="0.5"/>
    <line x1="50" y1="23" x2="54" y2="25" stroke="#7e22ce" stroke-width="0.5"/>
    <line x1="50" y1="31" x2="54" y2="33" stroke="#7e22ce" stroke-width="0.5"/>
    <line x1="50" y1="39" x2="54" y2="41" stroke="#7e22ce" stroke-width="0.5"/>
    <line x1="50" y1="46" x2="54" y2="48" stroke="#7e22ce" stroke-width="0.5"/>

    <path d="M19 53 L51 51 L55 52 L22 55 Z" fill="#d8b4fe"/>
    <path d="M18 10 L51 8 L52 50 L18 53 Z" fill="#1e0538"/>

    <!-- Purple bookmark ribbon -->
    <path d="M36 8 L40 8 L40 57 L38 54 L36 57 Z" fill="#c084fc" stroke="#7e22ce" stroke-width="0.5"/>

    <!-- Cover (Imperial Purple & Gold) -->
    <path d="M15 11 L48 8 C49.5 8, 51 9, 51 10.5 L51 49 C51 50.5, 49.5 51.5, 48 51.5 L15 54 Z"
          fill="url(#uniBk_cover)" stroke="#c084fc" stroke-width="0.9"/>

    <!-- Spine -->
    <path d="M12 11.5 C12 10, 13.5 9.5, 16 9.5 L18 9.5 L18 54 L16 54 C13.5 54, 12 53.5, 12 52 Z"
          fill="#3b0764" stroke="#c084fc" stroke-width="0.8"/>
    <line x1="12" y1="18" x2="18" y2="18" stroke="#fde047" stroke-width="0.9"/>
    <line x1="12" y1="31" x2="18" y2="31" stroke="#fde047" stroke-width="0.9"/>
    <line x1="12" y1="44" x2="18" y2="44" stroke="#fde047" stroke-width="0.9"/>

    <!-- Gold Corners -->
    <polygon points="41,8.5 50.5,8 50.5,17.5" fill="url(#uniBk_gold)"/>
    <polygon points="41,51.5 50.5,49.5 50.5,40.5" fill="url(#uniBk_gold)"/>

    <path d="M21 14 L46 12 L46 47 L21 49 Z" fill="none" stroke="#fde047" stroke-width="0.7"/>

    <!-- Central Omni-Skill Emblem (4 Branches Diamond) -->
    <circle cx="34" cy="27" r="10.5" fill="#1e0538" stroke="url(#uniBk_gold)" stroke-width="1.3"/>
    <!-- 4 colored branch gems -->
    <!-- Top: Military (Red) -->
    <polygon points="34,18 37,22 34,26 31,22" fill="#ef4444"/>
    <!-- Bottom: Logistics (Yellow) -->
    <polygon points="34,36 37,32 34,28 31,32" fill="#eab308"/>
    <!-- Left: Defense (Blue) -->
    <polygon points="25,27 29,24 33,27 29,30" fill="#3b82f6"/>
    <!-- Right: Knowledge (Green) -->
    <polygon points="43,27 39,24 35,27 39,30" fill="#10b981"/>
    <!-- Center white core diamond -->
    <polygon points="34,24.5 36.5,27 34,29.5 31.5,27" fill="#ffffff" stroke="#fbbf24" stroke-width="0.5"/>

    <!-- Clasp -->
    <path d="M48 24 L53 25 L53 31 L48 30 Z" fill="url(#uniBk_gold)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="50.5" cy="27.5" r="1" fill="#78350f"/>

    <!-- Title Badge -->
    <rect x="23" y="39" width="22" height="8" rx="2" ry="2" fill="#1e0538" stroke="url(#uniBk_gold)" stroke-width="1"/>
    <text x="34" y="43.3" text-anchor="middle" dominant-baseline="central" fill="#fef08a"
          font-family="system-ui, sans-serif" font-weight="900" font-size="6" letter-spacing="0.5">全能</text>
  </g>
</svg>
