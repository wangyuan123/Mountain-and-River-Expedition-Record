<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sklBk_cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="25%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="sklBk_spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="sklBk_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="sklBk_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#sklBk_shadow)">
    <!-- Page edges -->
    <path d="M49 14 L55 17 L55 52 L49 49 Z" fill="#d1fae5" stroke="#6ee7b7" stroke-width="0.5"/>
    <line x1="50" y1="23" x2="54" y2="25" stroke="#059669" stroke-width="0.5"/>
    <line x1="50" y1="31" x2="54" y2="33" stroke="#059669" stroke-width="0.5"/>
    <line x1="50" y1="39" x2="54" y2="41" stroke="#059669" stroke-width="0.5"/>
    <line x1="50" y1="46" x2="54" y2="48" stroke="#059669" stroke-width="0.5"/>

    <path d="M19 53 L51 51 L55 52 L22 55 Z" fill="#6ee7b7"/>
    <path d="M18 10 L51 8 L52 50 L18 53 Z" fill="#022c22"/>

    <!-- Green ribbon -->
    <path d="M36 8 L40 8 L40 57 L38 54 L36 57 Z" fill="#10b981" stroke="#047857" stroke-width="0.5"/>

    <!-- Cover (Emerald Green) -->
    <path d="M15 11 L48 8 C49.5 8, 51 9, 51 10.5 L51 49 C51 50.5, 49.5 51.5, 48 51.5 L15 54 Z"
          fill="url(#sklBk_cover)" stroke="#6ee7b7" stroke-width="0.8"/>

    <!-- Spine -->
    <path d="M12 11.5 C12 10, 13.5 9.5, 16 9.5 L18 9.5 L18 54 L16 54 C13.5 54, 12 53.5, 12 52 Z"
          fill="url(#sklBk_spine)" stroke="#10b981" stroke-width="0.75"/>
    <line x1="12" y1="18" x2="18" y2="18" stroke="#34d399" stroke-width="0.8"/>
    <line x1="12" y1="31" x2="18" y2="31" stroke="#34d399" stroke-width="0.8"/>
    <line x1="12" y1="44" x2="18" y2="44" stroke="#34d399" stroke-width="0.8"/>

    <!-- Metal Corners -->
    <polygon points="42,8.5 50.5,8 50.5,16.5" fill="url(#sklBk_metal)"/>
    <polygon points="42,51.5 50.5,49.5 50.5,41.5" fill="url(#sklBk_metal)"/>

    <path d="M21 14 L46 12 L46 47 L21 49 Z" fill="none" stroke="#a7f3d0" stroke-width="0.6" stroke-opacity="0.7"/>

    <!-- Central Skill Insignia: Crossed Tactical Blades & Energy Rune -->
    <circle cx="34" cy="27" r="10" fill="#022c22" stroke="url(#sklBk_metal)" stroke-width="1.2"/>
    <!-- Crossed Blades -->
    <path d="M27 34 L41 20 M41 20 L40 18 L38 20 M27 34 L28 36 L30 34" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M41 34 L27 20 M27 20 L28 18 L30 20 M41 34 L40 36 L38 34" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Skill Energy Core -->
    <circle cx="34" cy="27" r="3.2" fill="#34d399"/>
    <circle cx="34" cy="27" r="1.5" fill="#ffffff"/>

    <!-- Metal book lock clasp on right -->
    <path d="M48 24 L53 25 L53 31 L48 30 Z" fill="url(#sklBk_metal)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="50.5" cy="27.5" r="1" fill="#78350f"/>

    <!-- Title Badge -->
    <rect x="25" y="39" width="18" height="7.5" rx="2" ry="2" fill="#022c22" stroke="url(#sklBk_metal)" stroke-width="0.8"/>
    <text x="34" y="43" text-anchor="middle" dominant-baseline="central" fill="#fef08a"
          font-family="system-ui, sans-serif" font-weight="900" font-size="6" letter-spacing="0.5">SKILL</text>
  </g>
</svg>
