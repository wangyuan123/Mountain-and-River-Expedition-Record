<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sigJam_radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sigJam_wave" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
    <filter id="sigJam_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#sigJam_shadow)">
    <!-- Base Plate Medallion (Tactical EW Tablet) -->
    <path d="M14 8 L50 8 L56 16 L56 48 L50 56 L14 56 L8 48 L8 16 Z"
          fill="#0f172a" stroke="#e11d48" stroke-width="1.2"/>
    <path d="M16 10 L48 10 L53 17 L53 47 L48 54 L16 54 L11 47 L11 17 Z"
          fill="#1e1b4b" stroke="#312e81" stroke-width="0.8"/>

    <!-- Jamming Radiation Background -->
    <circle cx="32" cy="27" r="16" fill="url(#sigJam_wave)"/>

    <!-- Parabolic Radar Antenna Dish -->
    <path d="M22 34 C20 22, 32 16, 38 18 C44 20, 46 30, 36 36 Z"
          fill="url(#sigJam_radar)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Dish inner focal ring -->
    <ellipse cx="32" cy="26" rx="6" ry="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="0.6"/>

    <!-- Feed Horn / Emitter Needle -->
    <line x1="32" y1="26" x2="39" y2="20" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="39" cy="20" r="1.8" fill="#fb7185"/>

    <!-- Electromagnetic Jamming Pulse Waves (Interference Rings with Static Lightning) -->
    <path d="M43 14 C48 17, 51 22, 50 28" fill="none" stroke="#f43f5e" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 2"/>
    <path d="M47 10 C54 15, 57 23, 55 32" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3"/>

    <!-- Static Interference Lightning Bolts -->
    <path d="M23 14 L28 17 L25 21 L31 24" fill="none" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 25 L21 27 L18 31 L24 33" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Radar Tower Base / Struts -->
    <line x1="26" y1="35" x2="22" y2="44" stroke="#64748b" stroke-width="1.5"/>
    <line x1="34" y1="35" x2="38" y2="44" stroke="#64748b" stroke-width="1.5"/>
    <line x1="30" y1="35" x2="30" y2="44" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="20" y1="44" x2="40" y2="44" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Command Label Banner ("干扰令") -->
    <rect x="18" y="46.5" width="28" height="10" rx="2.5" ry="2.5" fill="#881337" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="32" y="52" text-anchor="middle" dominant-baseline="central" fill="#ffffff"
          font-family="system-ui, 'PingFang SC', sans-serif" font-weight="900" font-size="6.8" letter-spacing="1">干扰令</text>
  </g>
</svg>
