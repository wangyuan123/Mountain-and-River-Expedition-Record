<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="feint_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#7e22ce"/>
      <stop offset="80%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="feint_ghost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="feint_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#feint_shadow)">
    <!-- Base Plate (Tactical Deception Tablet) -->
    <path d="M14 8 L50 8 L56 16 L56 48 L50 56 L14 56 L8 48 L8 16 Z"
          fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2"/>
    <path d="M16 10 L48 10 L53 17 L53 47 L48 54 L16 54 L11 47 L11 17 Z"
          fill="#0f172a" stroke="#4338ca" stroke-width="0.8"/>

    <!-- Holographic Deception Mirage Lines / Grid -->
    <line x1="14" y1="20" x2="50" y2="20" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="14" y1="26" x2="50" y2="26" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="14" y1="38" x2="50" y2="38" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Ghostly Hologram Decoy Mask (Right, semi-transparent) -->
    <g transform="translate(38, 25) scale(0.85)" opacity="0.6">
      <path d="M0 -12 C9 -12, 14 -5, 14 5 C14 13, 8 18, 0 20 C-8 18, -14 13, -14 5 C-14 -5, -9 -12, 0 -12 Z"
            fill="url(#feint_ghost)" stroke="#67e8f9" stroke-width="1"/>
      <ellipse cx="-5" cy="0" rx="3" ry="4" fill="#0f172a"/>
      <ellipse cx="5" cy="0" rx="3" ry="4" fill="#0f172a"/>
      <path d="M-4 10 C-1 12, 1 12, 4 10" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Divergent Tactical Arrow (Decoy route curving away) -->
    <path d="M26 38 C32 34, 42 34, 48 24" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-dasharray="3 2" stroke-linecap="round"/>
    <polygon points="48,21 44,25 49,26" fill="#22d3ee"/>

    <!-- Primary Tactical Stealth Feint Mask (Left / Foreground) -->
    <g transform="translate(26, 27)">
      <path d="M0 -14 C10 -14, 15 -6, 15 5 C15 14, 9 20, 0 22 C-9 20, -15 14, -15 5 C-15 -6, -10 -14, 0 -14 Z"
            fill="url(#feint_mask)" stroke="#c084fc" stroke-width="1.2"/>
      <!-- Mask forehead crest -->
      <polygon points="0,-12 3,-7 0,-8 -3,-7" fill="#fde047"/>
      <!-- Slanted eye slits -->
      <path d="M-9 -1 L-2 2 L-8 4 Z" fill="#ffffff"/>
      <path d="M9 -1 L2 2 L8 4 Z" fill="#ffffff"/>
      <ellipse cx="-5" cy="1.5" rx="1.5" ry="1.5" fill="#581c87"/>
      <ellipse cx="5" cy="1.5" rx="1.5" ry="1.5" fill="#581c87"/>
      <!-- Subtle deceptive smirk -->
      <path d="M-5 11 C-1 13, 3 14, 7 11" fill="none" stroke="#f3e8ff" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Bottom Command Label Banner ("佯动令") -->
    <rect x="18" y="46.5" width="28" height="10" rx="2.5" ry="2.5" fill="#4c1d95" stroke="#c084fc" stroke-width="1.2"/>
    <text x="32" y="52" text-anchor="middle" dominant-baseline="central" fill="#ffffff"
          font-family="system-ui, 'PingFang SC', sans-serif" font-weight="900" font-size="6.8" letter-spacing="1">佯动令</text>
  </g>
</svg>
