<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer medallion rim (Tactical Titanium & Silver) -->
    <linearGradient id="tpNorm_silverRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Inner field gradient (Brushed Obsidian & Space Deep Blue) -->
    <linearGradient id="tpNorm_plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Quantum Teleport Warp Portal Radial Glow (Azure Blue) -->
    <radialGradient id="tpNorm_portalGlow" cx="50%" cy="47%" r="48%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="90%" stop-color="#0369a1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Text silver-cyan gradient -->
    <linearGradient id="tpNorm_silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="tpNorm_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#tpNorm_shadow)">
    <!-- Base Medallion Body (Command Warrant Tablet) -->
    <path d="M22 4.5 C26 3, 38 3, 42 4.5 L53 13 L56 34 L51 53.5 L32 60.5 L13 53.5 L8 34 L11 13 Z"
          fill="url(#tpNorm_silverRim)" stroke="#94a3b8" stroke-width="0.8" stroke-linejoin="round"/>

    <!-- Inner Beveled Slate Field -->
    <path d="M23 7 C26.5 5.8, 37.5 5.8, 41 7 L50.5 14.5 L53.2 33.5 L48.8 51 L32 57.5 L15.2 51 L10.8 33.5 L13.5 14.5 Z"
          fill="url(#tpNorm_plate)" stroke="#475569" stroke-width="0.8"/>

    <!-- Top Hanging Loop -->
    <circle cx="32" cy="7.5" r="2.2" fill="#334155" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="32" cy="7.5" r="1.1" fill="#f8fafc"/>

    <!-- Quantum Warp Portal Core -->
    <circle cx="32" cy="30" r="17" fill="url(#tpNorm_portalGlow)"/>

    <!-- Swirling Random Warp Spiral Rings -->
    <circle cx="32" cy="30" r="16.5" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="3 3" stroke-opacity="0.6"/>
    <circle cx="32" cy="30" r="12" fill="none" stroke="#7dd3fc" stroke-width="0.6" stroke-dasharray="4 2" stroke-opacity="0.5"/>
    <circle cx="32" cy="30" r="8" fill="none" stroke="#bae6fd" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.7"/>

    <!-- Random Spatial Vortex Arcs -->
    <path d="M22 23 C26 19, 38 19, 42 23" fill="none" stroke="#7dd3fc" stroke-width="0.8" stroke-opacity="0.7"/>
    <path d="M42 37 C38 41, 26 41, 22 37" fill="none" stroke="#7dd3fc" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- Central Command Warrant Character "令" -->
    <text x="32" y="31.5"
          text-anchor="middle"
          dominant-baseline="central"
          fill="url(#tpNorm_silverText)"
          stroke="#0f172a"
          stroke-width="0.75"
          paint-order="stroke fill"
          font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
          font-weight="900"
          font-size="19"
          letter-spacing="0">令</text>

    <!-- Corner Rivets -->
    <circle cx="12.5" cy="15" r="1.2" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>
    <circle cx="51.5" cy="15" r="1.2" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>
    <circle cx="10" cy="34" r="1.2" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>
    <circle cx="54" cy="34" r="1.2" fill="#cbd5e1" stroke="#334155" stroke-width="0.5"/>

    <!-- Bottom Tactical Plaque ("普通") -->
    <g transform="translate(0, 0)">
      <rect x="19" y="47.5" width="26" height="10.5" rx="2.5" ry="2.5"
            fill="#0f172a" stroke="#94a3b8" stroke-width="1.1"/>
      <rect x="20" y="48.5" width="24" height="8.5" rx="1.8" ry="1.8"
            fill="#1e293b" stroke="#64748b" stroke-width="0.5"/>
      <text x="32" y="52.7"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#e2e8f0"
            font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-weight="900"
            font-size="7.5"
            letter-spacing="1">普通</text>
    </g>
  </g>
</svg>
