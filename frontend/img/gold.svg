<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="20%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="80%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbe5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fffbe5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fffbe5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- Drop shadow -->
  <ellipse cx="64" cy="108" rx="42" ry="5" fill="#000" opacity="0.3"/>
  <!-- Main ingot body (rounded rectangle, slightly tilted) -->
  <path d="M 28,30 Q 28,22 38,22 L 90,22 Q 100,22 100,30 L 100,90 Q 100,98 90,98 L 38,98 Q 28,98 28,90 Z"
        fill="url(#goldGrad)" stroke="#6b4f0a" stroke-width="1.5"/>
  <!-- Top edge highlight -->
  <path d="M 30,30 Q 30,24 38,24 L 90,24 Q 98,24 98,30 L 98,40 L 30,40 Z"
        fill="url(#goldHighlight)"/>
  <!-- Engraved geometric patterns -->
  <g stroke="#7a5a10" stroke-width="1.5" fill="none" opacity="0.85">
    <!-- Left swirl pattern -->
    <path d="M 42,55 Q 48,48 54,55 Q 60,62 54,68 Q 48,74 42,68 Q 36,62 42,55 Z"/>
    <!-- Right swirl pattern -->
    <path d="M 74,55 Q 80,48 86,55 Q 92,62 86,68 Q 80,74 74,68 Q 68,62 74,55 Z"/>
    <!-- Center diamond -->
    <path d="M 60,75 L 64,72 L 68,75 L 64,78 Z" fill="#a07515" stroke="#6b4f0a"/>
    <!-- Top center marker -->
    <path d="M 62,40 L 66,36 L 64,44 Z" fill="#a07515" stroke="#6b4f0a" stroke-width="0.8"/>
  </g>
  <!-- Bottom shadow -->
  <path d="M 28,70 L 100,70 L 100,90 Q 100,98 90,98 L 38,98 Q 28,98 28,90 Z"
        fill="url(#goldShadow)" opacity="0.4"/>
  <!-- Side bevels -->
  <line x1="30" y1="32" x2="30" y2="88" stroke="#fff4b8" stroke-width="1" opacity="0.5"/>
  <line x1="98" y1="32" x2="98" y2="88" stroke="#5a4209" stroke-width="1" opacity="0.6"/>
  <!-- Top sparkle -->
  <circle cx="42" cy="32" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="84" cy="36" r="1" fill="#fff" opacity="0.7"/>
</svg>
