<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
  <defs>
    <!-- Lid gradient: Warm lustrous military gold -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Crate body: Deep armored bronze-steel -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="25%" stop-color="#5c2306"/>
      <stop offset="75%" stop-color="#3d1502"/>
      <stop offset="100%" stop-color="#1f0901"/>
    </linearGradient>

    <!-- Metal reinforcement bands: Bright polished brass/gold -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Star insignia: Radiant white-gold -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Soft ambient shadow -->
    <filter id="chestShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#chestShadow)">
    <!-- Base ground shadow -->
    <ellipse cx="12" cy="20.5" rx="8.5" ry="1.5" fill="#000000" opacity="0.4"/>

    <!-- Crate Chest Body -->
    <rect x="3" y="8" width="18" height="11.5" rx="1.5" fill="url(#bodyGrad)" stroke="#78350f" stroke-width="0.5"/>

    <!-- Bottom reinforcement base rim -->
    <rect x="3" y="18" width="18" height="1.5" rx="0.5" fill="url(#bandGrad)"/>

    <!-- Left & Right vertical armored straps -->
    <rect x="5.5" y="8" width="2.6" height="11.5" fill="url(#bandGrad)"/>
    <rect x="15.9" y="8" width="2.6" height="11.5" fill="url(#bandGrad)"/>

    <!-- Crate Chest Lid (arched trapezoid) -->
    <path d="M2.2 8.3 L4.6 4.2 C4.9 3.6 5.6 3.2 6.4 3.2 L17.6 3.2 C18.4 3.2 19.1 3.6 19.4 4.2 L21.8 8.3 Z" fill="url(#lidGrad)" stroke="#592507" stroke-width="0.6"/>

    <!-- Specular highlight glint across top lid -->
    <path d="M5.5 4.2 L18.5 4.2" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>

    <!-- Center vertical lid strap -->
    <rect x="10.5" y="3.2" width="3" height="5.5" fill="url(#bandGrad)"/>

    <!-- Heavy metal lock clasp / latch -->
    <rect x="9.8" y="7.8" width="4.4" height="4.6" rx="0.8" fill="url(#bandGrad)" stroke="#592507" stroke-width="0.5"/>
    <!-- Lock slot / keyhole -->
    <circle cx="12" cy="9.6" r="0.75" fill="#1f0901"/>
    <rect x="11.7" y="9.6" width="0.6" height="1.4" fill="#1f0901"/>

    <!-- Center Military Star Emblem -->
    <polygon points="12,13.2 12.8,14.8 14.5,14.9 13.2,16.0 13.6,17.7 12,16.7 10.4,17.7 10.8,16.0 9.5,14.9 11.2,14.8" fill="url(#starGrad)" stroke="#78350f" stroke-width="0.35"/>

    <!-- Armor Rivets / Bolts on corner straps -->
    <circle cx="6.8" cy="9.6" r="0.55" fill="#fffbeb"/>
    <circle cx="6.8" cy="17.6" r="0.55" fill="#fffbeb"/>
    <circle cx="17.2" cy="9.6" r="0.55" fill="#fffbeb"/>
    <circle cx="17.2" cy="17.6" r="0.55" fill="#fffbeb"/>
  </g>
</svg>
