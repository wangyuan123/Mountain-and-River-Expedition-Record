<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Primary Figure Gradient (Worker / Citizen) -->
    <linearGradient id="popBody1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Secondary Figure Gradient (Farmer / Companion) -->
    <linearGradient id="popBody2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Skin Tone -->
    <linearGradient id="popSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <!-- Cap Tone -->
    <linearGradient id="popCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Secondary Figure (Behind, Right) -->
  <!-- Body -->
  <path d="M19 28 C19 23 21 21 24 21 C27 21 29 23 29 28 Z" fill="url(#popBody2)" stroke="#065f46" stroke-width="0.7"/>
  <!-- Head -->
  <circle cx="24" cy="15" r="4.2" fill="url(#popSkin)" stroke="#c2410c" stroke-width="0.7"/>
  <!-- Hair / Straw Hat -->
  <path d="M19.5 14 C19.5 10 28.5 10 28.5 14 Z" fill="#d97706" stroke="#92400e" stroke-width="0.6"/>

  <!-- Primary Figure (Foreground, Left/Center) -->
  <!-- Shoulders & Torso -->
  <path d="M5 29 C5 22.5 8 19.5 13.5 19.5 C19 19.5 22 22.5 22 29 Z" fill="url(#popBody1)" stroke="#1e3a8a" stroke-width="0.8"/>
  <!-- Collar / Shirt Detail -->
  <polygon points="13.5,23.5 11.5,19.5 15.5,19.5" fill="#f8fafc" stroke="#1e3a8a" stroke-width="0.5"/>

  <!-- Head -->
  <circle cx="13.5" cy="13.5" r="5" fill="url(#popSkin)" stroke="#c2410c" stroke-width="0.8"/>
  <!-- Worker Hardhat / Cap -->
  <path d="M7.5 12.5 C7.5 7.5 19.5 7.5 19.5 12.5 Z" fill="url(#popCap)" stroke="#78350f" stroke-width="0.8"/>
  <!-- Cap Visor -->
  <path d="M7 12.5 Q13.5 14 20 12.5" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>
</svg>
