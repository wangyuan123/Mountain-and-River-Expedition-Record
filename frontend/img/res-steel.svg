<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Steel Top Face Gradient -->
    <linearGradient id="steelTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Steel Front Face Gradient -->
    <linearGradient id="steelFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Steel Side Face Gradient -->
    <linearGradient id="steelSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Cyan Steel Specular Shine -->
    <linearGradient id="steelShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Bottom Ingot -->
  <!-- Top Face -->
  <polygon points="4,20 10,16 26,16 20,20" fill="url(#steelTop)" stroke="#334155" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Front Face -->
  <polygon points="4,20 20,20 18,27 2,27" fill="url(#steelFront)" stroke="#1e293b" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Right Side Face -->
  <polygon points="20,20 26,16 24,23 18,27" fill="url(#steelSide)" stroke="#0f172a" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Edge Highlight -->
  <line x1="4.5" y1="20" x2="19.5" y2="20" stroke="#f8fafc" stroke-width="0.7"/>

  <!-- Top Ingot (Stacked & Offset) -->
  <!-- Top Face -->
  <polygon points="10,11 16,7 30,7 24,11" fill="url(#steelTop)" stroke="#334155" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Front Face -->
  <polygon points="10,11 24,11 22,17 8,17" fill="url(#steelFront)" stroke="#1e293b" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Right Side Face -->
  <polygon points="24,11 30,7 28,13 22,17" fill="url(#steelSide)" stroke="#0f172a" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Edge Highlight -->
  <line x1="10.5" y1="11" x2="23.5" y2="11" stroke="#f8fafc" stroke-width="0.7"/>

  <!-- Steel Sparkle / Specular glint -->
  <path d="M10 7.5 L11 9 L12.5 10 L11 11 L10 12.5 L9 11 L7.5 10 L9 9 Z" fill="#ffffff" opacity="0.85"/>
</svg>
