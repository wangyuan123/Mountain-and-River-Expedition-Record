<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#4a2a6a"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4a6a"/>
      <stop offset="100%" stop-color="#2a1a3a"/>
    </linearGradient>
    <linearGradient id="crystal4A" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="crystal4B" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <!-- Night sky background -->
  <rect x="0" y="0" width="128" height="128" fill="url(#sky4)" rx="8"/>
  <rect x="0" y="0" width="128" height="128" fill="url(#glow4)" rx="8"/>
  <!-- Stars -->
  <circle cx="20" cy="18" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="12" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="100" cy="20" r="1.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="115" cy="35" r="0.6" fill="#ffffff" opacity="0.5"/>
  <circle cx="14" cy="40" r="0.8" fill="#ffffff" opacity="0.7"/>
  <!-- Cave opening / mountain silhouette -->
  <path d="M 0,128 L 0,75 Q 30,55 64,55 Q 98,55 128,75 L 128,128 Z" fill="url(#rock4)"/>
  <!-- Cave dark entrance -->
  <ellipse cx="64" cy="98" rx="22" ry="18" fill="#1a0a2a"/>
  <!-- Cave rocks around entrance -->
  <path d="M 38,95 Q 42,82 50,80 L 50,95 Z" fill="#4a3a5a"/>
  <path d="M 90,95 Q 86,82 78,80 L 78,95 Z" fill="#4a3a5a"/>
  <!-- Main purple crystal (center, largest) -->
  <path d="M 64,55 L 76,75 L 70,98 L 58,98 L 52,75 Z" fill="url(#crystal4A)" stroke="#6b21a8" stroke-width="0.8"/>
  <path d="M 64,55 L 70,72 L 64,96 L 58,72 Z" fill="url(#crystal4B)" opacity="0.4"/>
  <!-- Left crystal -->
  <path d="M 38,75 L 46,82 L 42,98 L 32,90 L 30,80 Z" fill="url(#crystal4A)" stroke="#6b21a8" stroke-width="0.6"/>
  <!-- Right crystal -->
  <path d="M 90,75 L 96,80 L 94,90 L 84,98 L 80,82 Z" fill="url(#crystal4A)" stroke="#6b21a8" stroke-width="0.6"/>
  <!-- Small front crystal -->
  <path d="M 56,90 L 64,86 L 70,95 L 64,100 L 56,95 Z" fill="url(#crystal4B)" stroke="#6b21a8" stroke-width="0.5"/>
  <!-- Highlights on crystals -->
  <line x1="64" y1="55" x2="60" y2="85" stroke="#f3e8ff" stroke-width="1.2" opacity="0.8"/>
  <line x1="40" y1="78" x2="38" y2="90" stroke="#f3e8ff" stroke-width="0.8" opacity="0.6"/>
  <line x1="88" y1="78" x2="86" y2="90" stroke="#f3e8ff" stroke-width="0.8" opacity="0.6"/>
  <!-- Ground sparkles -->
  <circle cx="20" cy="115" r="1" fill="#c084fc" opacity="0.8"/>
  <circle cx="108" cy="118" r="1" fill="#c084fc" opacity="0.8"/>
  <circle cx="30" cy="120" r="0.6" fill="#e9d5ff" opacity="0.7"/>
</svg>
